[[change.contract.decisions.clauses.updates]]
id = "INSTALL-ENTRY-001"
version = 4
topic = "skill-installation"
scope = [
    "Repository manifest format",
    "Skill update",
]
statement = "Manifest format stays 5. Omitted evidence fields mean the published evidence protocol and schema digest, and an explicit digest must equal that schema. update resolves the newest published GitHub release of R0k1e/Signetum, downloads its Skill archive, release-source.json and SHA256SUMS, verifies both files against the checksums and the extracted Skill's version and content digest against the release metadata, prepares that candidate's environment and checks the project manifest, then replaces the installed Skill folder in place from a staged sibling copy, rolls back a failed swap and verifies the result. A Skill folder inside a Git work tree is refused; a checkout follows Git and setup. An equal Skill digest or an older release changes nothing, an incompatible manifest returns migration_required before replacement, and --check stays read-only. update runs no host command and never edits a project or hook configuration; a hook names the stable Skill path and survives an update. Skill content identity and engine implementation identity stay separate and share one labeled digest function."
rationale = "The published release already carries the Skill archive, its source metadata and checksums, so reading it directly removes the marketplace pin and its second release change. Replacing the folder in place keeps every hook path stable, so no host re-reviews or reinstalls anything after an update."

[[change.contract.decisions.clauses.updates]]
id = "INSTALL-RUNTIME-001"
version = 2
topic = "skill-installation"
scope = [
    "Engine environment",
]
statement = "The locked engine environment lives in ${XDG_DATA_HOME:-~/.local/share}/signetum/runtime/<fingerprint>, where the fingerprint covers the implementation digest, uv.lock and pyproject.toml and not the install path. A shared runtime/host-python link only starts the launcher, which verifies the environment for its own fingerprint. setup and ordinary commands write nothing into the Skill directory except interpreter bytecode caches."
rationale = "A path-independent fingerprint lets every installed copy and an update candidate share one prepared environment, and a Skill directory without generated files keeps the content digest that update and install verify."

[[change.contract.decisions.clauses.updates]]
id = "SKILL-ENTRY-001"
version = 4
topic = "skill-first-development"
scope = [
    "Distribution entry",
]
statement = "Signetum is distributed as one standard Agent Skill folder, skills/signetum, published with each release as signetum-skill-<version>.zip. Copying or unpacking that folder into any agent tool's skills directory is a complete install, and every protocol operation works without the command guard: receipts and batch-deliver as the only operation that advances the delivery branch carry the protocol guarantees, and the guard adds early refusal of work-losing commands. A host loads one Signetum Skill. New and existing projects share one explicit local adoption path. Internal scaffold materials are not a second public product."
rationale = "The plugin existed mainly because a hook could only ship inside one. Hosts read hook entries from their own configuration, and the Skill already carries the guard script, so one folder serves every tool; this removes the Codex hook re-review and cache deletion on every update, the duplicate Skill next to a plain copy and the marketplace that a local folder could not refresh."

[[change.contract.decisions.clauses.updates]]
id = "PRODUCT-DISTRIBUTION-001"
version = 4
topic = "product-foundations"
scope = [
    "Distribution and use",
]
statement = "Keep installation, distribution and use simple: one standard Skill folder for every agent tool, an optional deterministic install command that places it and registers the guard where a host reads hooks, and repository-owned instructions and commands. Position for reliable development with large agent teams using concrete cases and accurately bounded evidence."
rationale = "One folder to copy works in every tool; the optional command only automates placement and hook registration, so skipping it loses early refusal and nothing else."

[[change.contract.decisions.clauses.updates]]
id = "GUARD-SCOPE-001"
version = 2
topic = "command-guard"
scope = [
    "Command guard hook",
]
statement = "The guard is an optional PreToolUse Bash hook entry in a host's configuration that runs an installed Skill's scripts/command-guard. It applies the whole rule set when the payload cwd lies in a Git work tree whose root holds signetum.toml and allows every command elsewhere. A missing interpreter, malformed payload, exception or timeout exits 0 with a diagnostic, and the sh entry maps every status other than 2 to 0. It prevents mistakes and is not a security boundary."
rationale = "A user-level hook reaches every repository, so the adopted-repository check replaces the per-project plugin enablement that used to bound it without committing machine-specific hook paths into projects. Failing open keeps a broken guard from stopping every shell command; the owner accepted that trade."

[[change.contract.decisions.clauses]]
id = "skill-is-the-distribution/withdraw-plugin-enablement"
change_id = "skill-is-the-distribution"
action = "withdraw"
