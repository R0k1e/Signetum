[[change.contract.decisions.clauses.updates]]
id = "CONSUMER-ENABLE-001"
version = 2
topic = "consumer-adoption"
scope = [
    "Adoption preview and apply",
]
statement = "The adoption preview that writes signetum.toml also enables the plugin at project scope: enabledPlugins signetum@signetum and the signetum GitHub marketplace in .claude/settings.json, and [plugins.\"signetum@signetum\"] enabled = true in .codex/config.toml. Other settings are preserved, enabled files stay unchanged and an explicit disable is refused for review. Codex reads that layer only for trusted projects and only for a plugin installed in the user's Codex home."
rationale = "Project settings are committed with the repository, so every collaborator's host enables the guard there, and the guard's scope follows the repositories that adopted the protocol. Codex merges trusted project config layers into the plugin set, verified with codex-cli 0.166.0 in a temporary home."
status = "withdrawn"

