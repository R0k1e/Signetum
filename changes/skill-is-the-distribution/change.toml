[[change.contract.decisions.clauses.updates]]
id = "INSTALL-HOOK-001"
version = 1
topic = "skill-installation"
scope = [
    "Install command",
    "Hook registration",
]
statement = "sh <skill>/scripts/signetum install places the Skill at each target: --host claude at ${CLAUDE_CONFIG_DIR:-~/.claude}/skills/signetum, --host codex at ${CODEX_HOME:-~/.codex}/skills/signetum, and --skills-dir DIR at DIR/signetum for any other tool. The source is the running Skill by default, a local Skill folder or release archive with --source, or a published release with --release <tag> or latest, verified like update. For each host target it writes one PreToolUse Bash entry running that copy's scripts/command-guard into the host's user hook configuration, settings.json for Claude Code and hooks.json for Codex, preserving every other setting and replacing only Signetum guard entries. It is idempotent; --preview reports the exact plan and writes nothing; --remove deletes the Signetum guard entries and the placed Skill. It refuses a target folder that is not a Signetum Skill or lies inside a Git work tree and never edits a project. When a host target also has the signetum@signetum plugin installed at user scope, install removes it through that host's plugin manager after the Skill and hook are in place, and reports a project-scope plugin with its removal command instead of running it."
rationale = "A deterministic, previewable and reversible command replaces the plugin manager for the one thing the plugin added, the hook entry; placing the Skill and registering the hook together keeps the path the hook names correct. Removing an earlier user-scope plugin in the same step avoids two Skills, while project settings stay under the project's own review. Project-scope hook entries were not chosen because they would commit one machine's Skill path into the project."

[[change.contract.decisions.clauses.updates]]
id = "INSTALL-GUIDE-001"
version = 1
topic = "command-guard"
scope = [
    "Status guidance",
]
statement = "When the running Skill sits in a Claude Code or Codex user skills directory and no hook entry in that host's user configuration or in the project's .claude/settings.json, .claude/settings.local.json or .codex/hooks.json runs its scripts/command-guard, status reports one guard entry naming the host, the install command and the exact hook entry to add by hand. The guidance never blocks or changes an operation, and a Skill anywhere else reports nothing about the guard."
rationale = "Without a plugin nothing enables the guard implicitly, so the one command an agent runs first states how to enable it; tying detection to the Skill's own location keeps it deterministic, and tools without a known hook surface are not nagged."

[[change.contract.decisions.clauses.updates]]
id = "RELEASE-TAG-001"
version = 1
topic = "distribution-authorities"
scope = [
    "Release publication",
]
statement = "A release is one delivered change that sets the product version and its notes, followed by an annotated v<version> tag on the delivered main commit; the release workflow publishes the Skill archive, internal wheel and sdist, release-source.json, release notes and SHA256SUMS. No file on main records a release, and update and install --release read published releases."
rationale = "A pin recording the release commit cannot be part of that commit, so it forced a second change after every release; the published release already binds the exact source and checksums."

[change.contract.autonomy]
allowed = [
    "Move plugins/signetum/skills/signetum to skills/signetum, delete the plugin manifest and hooks file, follow the move through tools, tests, checks, workflows, lockfiles and documents, and relock without upgrading dependencies.",
    "Replace scripts/update.py with one stdlib distribution script for install and update, route both through the sh launcher, add a stdlib host configuration module to the engine, add the guard's adopted-repository check and the status guard entry, and remove adoption's plugin enablement and the release pin machinery.",
    "Delete the pin, plugin-update and enablement tests and replace them with functional install, update, guard-scope and status tests on temporary directories with a fake HOME, CLAUDE_CONFIG_DIR and CODEX_HOME and fake host CLIs.",
    "Probe hook and Skill discovery with codex app-server in a temporary HOME and CODEX_HOME and with claude using a temporary settings file.",
    "Run ready, open a batch, admit this member, run final and deliver the batch to main.",
]
requires_confirmation = [
    "Tagging or publishing a release, or abandoning the change/pin-0-4-0 workspace.",
    "Editing ~/.claude, ~/.codex, ~/.local/share/signetum*, any installed Skill or plugin, or a consumer project such as PyReduce.",
]

