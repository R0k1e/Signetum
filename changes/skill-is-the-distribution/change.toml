id = "STEP-LAYOUT"
requirements = ["LAYOUT-001"]
action = "Move the Skill to skills/signetum, remove the plugin files and follow every path."

[[change.execution.steps]]
id = "STEP-DISTRIBUTION"
requirements = ["INSTALL-001", "UPDATE-003"]
action = "Write the distribution script with install and update over shared release verification and staged replacement, the engine host configuration module and the launcher routing, with fake-home functional tests."

[[change.execution.steps]]
id = "STEP-GUARD"
requirements = ["GUARD-002", "GUIDE-001"]
action = "Add the adopted-repository check to the guard and the guard entry to status, with payload and installed-copy tests."

[[change.execution.steps]]
id = "STEP-ADOPT-RELEASE"
requirements = ["ADOPT-002", "RELEASE-002"]
action = "Remove adoption's plugin enablement and the release pin machinery and their tests, and rewrite the release guide."

[[change.execution.steps]]
id = "STEP-DOCS"
requirements = ["DOC-003"]
action = "Reconcile the Skill, references, entry documents, architecture, site, policy references, command help and changelog, including the migration commands."

