[change]
schema_version = 1
id = "skill-is-the-distribution"

[change.source]
kind = "human_direction"
summary = "The owner reopened plugin distribution on 2026-11-08 after review of its costs: the plugin exists mainly because a hook could only ship inside a plugin, yet Codex re-reviews the plugin hook after every update and deletes the old cache directory at once, a plain Skill next to the plugin lists two Skills, hosts other than Claude Code and Codex get no guard, a local-folder marketplace cannot fetch new versions, and every release needs a second pin change because the marketplace pin records the release commit itself. The guard fails open; it prevents mistakes and is not a security boundary. Codex-cli 0.167.0 in a temporary CODEX_HOME lists a Skill folder in $CODEX_HOME/skills and a PreToolUse entry in $CODEX_HOME/hooks.json, trusted by the hash of its definition rather than of the Skill content, and Claude Code reads hooks from settings.json, so the Skill can carry the guard script and one command can register it. The owner asked for one change, an optional install command with guidance when it is not run, and to fix the process rather than keep the second release change."

[change.contract]
version = 1
approved_base = "33a48dfa74731132f1193df212eb8b94bbb4efd7" # pragma: allowlist secret

[[change.contract.requirements]]
id = "LAYOUT-001"
outcome = "The standard Skill lives at skills/signetum and is the only distributed unit. The plugin manifest, plugin hooks file and plugins/ tree are removed and every repository path, tool, check, lockfile and document follows the move. A Skill folder copied or unpacked on its own into any directory is a complete install that runs setup, identity and status."
acceptance = [
    "The delivered tree has no plugins/ directory, .claude-plugin directory or marketplace file, and release build, bandit, coverage, lockfiles and impact rules name skills/signetum.",
    "Skill folders copied to several directories share one prepared environment and run setup, identity and status in a Git project without changing their file sets.",
]

[[change.contract.requirements]]
id = "INSTALL-001"
outcome = "sh <skill>/scripts/signetum install places the Skill and registers the command guard as INSTALL-HOOK-001 states: host targets claude and codex, a --skills-dir target for any other tool, the running Skill, a local Skill folder or archive, or a verified published release as source, --preview and --remove, and removal of an earlier user-scope signetum@signetum plugin after the Skill and hook are in place."
acceptance = [
    "With a temporary HOME, CLAUDE_CONFIG_DIR and CODEX_HOME, install --host claude --host codex places the Skill in both user skills directories and adds exactly one guard entry to settings.json and hooks.json while preserving unrelated settings and hooks; a second run reports unchanged and changes no byte.",
    "--preview reports the same plan and changes no file; --remove deletes the guard entries and placed Skills and preserves the other settings.",
    "--skills-dir places only the Skill; a target folder that is not a Signetum Skill or lies inside a Git work tree, and host configuration that is not a JSON object, are refused and left unchanged.",
    "--release latest and --release v<version> install a served release only after its archive and metadata checksums and the extracted Skill digest match; a mismatch fails without placing anything.",
    "With fake claude and codex reporting signetum@signetum installed, install runs claude plugin uninstall for a user-scope Claude plugin and codex plugin remove, and reports a project-scope Claude plugin with its removal command without running it.",
    "The hook command written into settings.json, run through sh with a captured Bash payload, refuses git stash in an adopted repository through the installed copy.",
]

[[change.contract.requirements]]
id = "UPDATE-003"
outcome = "update resolves the newest published release and replaces the installed Skill folder in place as INSTALL-ENTRY-001 version 4 states, with no plugin, marketplace, pin or host plugin manager path."
acceptance = [
    "With a served latest release, checksums, metadata and archive for a changed Skill, update replaces the folder, leaves no staging or backup sibling, keeps the host hook configuration byte-identical, invokes no host command and the replaced folder's identity runs.",
    "An incompatible project manifest returns migration_required and leaves the folder unchanged.",
    "A release with the installed digest or an older version returns current and changes nothing; a checksum or metadata mismatch fails and changes nothing; an offline --check reports unavailable.",
    "A Skill folder inside a Git work tree is refused and unchanged.",
]

[[change.contract.requirements]]
id = "GUARD-002"
outcome = "The guard applies its rules only when the payload cwd lies in a Git work tree whose root holds signetum.toml, as GUARD-SCOPE-001 version 2 states; every rule, wrapper traversal and fail-open behavior is otherwise unchanged."
acceptance = [
    "A git stash payload exits 0 in a Git repository without signetum.toml and exits 2 in one with it, including from a subdirectory and a linked worktree.",
    "The existing rule, wrapper, dirty-tree and fail-open payload tests pass in an adopted repository.",
]

[[change.contract.requirements]]
id = "GUIDE-001"
outcome = "status tells the agent once per output, concisely and without blocking, how to enable the guard when the running Skill sits in a Claude Code or Codex user skills directory and no hook runs its guard, as INSTALL-GUIDE-001 states."
acceptance = [
    "With the Skill in a temporary Claude user skills directory and no hook, status passes and reports guard with host claude, the install command and the exact hook entry; after install it reports no guard entry.",
    "A Skill outside the host skills directories reports no guard entry.",
]

[[change.contract.requirements]]
id = "ADOPT-002"
outcome = "Adoption writes only the reviewed signetum.toml and exact-hash retirements; it no longer enables a plugin in .claude/settings.json or .codex/config.toml."
acceptance = [
    "Adopting a repository with and without host settings previews and applies only signetum.toml and leaves existing .claude/settings.json and .codex/config.toml byte-identical.",
]

[[change.contract.requirements]]
id = "RELEASE-002"
outcome = "A release is one change that sets the product version plus the tag, as RELEASE-TAG-001 states. Release tooling drops the plugin manifest check, the marketplace pin writer and the release pin command, and the release guide drops the pin step."
acceptance = [
    "Release preflight requires the package and Skill versions to agree without a plugin manifest; tools.cli has no release pin command and tools.release no marketplace writer.",
    "docs/maintainers/releasing.md describes the version change and the tag as the whole release and verifies installation through install --release in an isolated home.",
]

[[change.contract.requirements]]
id = "DOC-003"
outcome = "SKILL.md, the adoption reference, README, QUICKSTART, CONTRIBUTING, the guide, architecture pages, product site, repository policy references, command help and the unreleased changelog describe the Skill folder install, the optional install command, the guard scope and guidance, update from published releases, and the migration from the plugin: install the Skill and hook, remove the plugin and its marketplace, and remove project plugin enablement through the project's own process."
acceptance = [
    "No current document instructs a plugin or marketplace install, and each named page states the guarantee without the guard and the migration commands where it covers installation.",
]

