[change]
schema_version = 2
id = "message-check-before-intent"

[change.source]
kind = "human_direction"
summary = "A downstream project with a commit-msg hook found that a message the hook refuses left a pending operation record, a half-made merge or a fresh batch workspace behind, and every corrected retry then failed. The owner approved fixing this and publishing a patch release."

[change.contract]
version = 1
approved_base = "a5c48e07ef43f072a5b180a6487bc5b1c1d06869" # pragma: allowlist secret

[[change.contract.requirements]]
id = "MSG-001"
outcome = "The project's commit-message check judges a request's message before any operation record, workspace or branch is created, for workspace-sync, batch-open, batch-admit, batch-continue, batch sync and batch-deliver."
acceptance = [
    "With a refusing hook, each of workspace-sync, batch-open and batch-admit refuses an invalid message leaving no pending record and no batch workspace or branch, and a valid retry succeeds.",
]

[[change.contract.requirements]]
id = "MSG-002"
outcome = "An operation that produced no commit takes a corrected message on retry: a pending record that differs only by message is replaced, a clean open merge the hook refused is committed with the corrected message judged together with the staged change, and a pending record whose message the hook refuses can no longer block another operation."
acceptance = [
    "A sync whose merge deletes files and whose first message the hook refuses succeeds on retry with a corrected message and leaves a clean tree.",
    "A pending record and open merge left by an engine that checked the message late are recovered by a corrected retry.",
]

[[change.contract.requirements]]
id = "REL-003"
outcome = "Release 0.9.4 carries the fix with the package and Skill versions and the changelog updated."
acceptance = ["Package and Skill versions agree on 0.9.4 and the changelog has a 0.9.4 section."]

[change.contract.autonomy]
allowed = [
    "Extend the operation records, workspace and lifecycle owners and their tests within these outcomes.",
    "Prepare, deliver and publish release 0.9.4 after final passes.",
]
requires_confirmation = [
    "Changing a record or manifest schema, or running update or install against an installed Skill.",
]

[[change.contract.decisions]]
id = "message-check-before-intent/message-first"
change_id = "message-check-before-intent"
authority = "changes/message-check-before-intent/change.toml#decisions/message-check-before-intent/message-first"
parents = ["provenance-simplify/local-operation-trust"]
reason = "Pending intent exists to survive an interrupted Git effect, not a refused request. A message the project's hook refuses can never become a commit, so recording it only creates a deadlock that needs manual removal. Judging the message first keeps refusals effect-free, and replacing the message of a pending operation that produced nothing keeps recovery possible when the hook's verdict depends on the staged change and is only known during the merge. Reopen if a hook must be judged with state that exists only after the commit."

[[change.contract.decisions.clauses]]
id = "message-check-before-intent/commit-merge"
change_id = "message-check-before-intent"
action = "amend"
expected = [{id = "COMMIT-MERGE-001", version = 3}]
authority = "changes/message-check-before-intent/change.toml#decisions/message-check-before-intent/message-first"
reason = "Pending intent never records a message the project refuses, and a corrected retry replaces it."

[[change.contract.decisions.clauses.updates]]
id = "COMMIT-MERGE-001"
version = 4
topic = "skill-first-development"
scope = ["Commit checks", "Workspace synchronization", "Batch admission", "Publication"]
statement = "The project's commit-msg hook judges a request's message before any operation record, workspace or branch is created. A recorded operation persists its pending intent before Git effects. A pending operation that produced no commit takes a corrected message on retry, and a clean open merge the hook refused is committed with it. The commit check validates the actual candidate commit, parents and tree against that operation, and completion and retry retain the same identity. New operation messages contain caller-supplied real content without automatically added Signetum trailers or internal tags. Ordinary commits and unrelated merges retain their authorization and project validation rules."
rationale = "Refused requests leave no effect, and the recorded message can be corrected until a commit exists."

[[change.execution.steps]]
id = "STEP-001"
requirements = ["MSG-001", "MSG-002"]
action = "Check the message first in each operation entry, replace a pending message that produced nothing, commit a clean open merge, and add regression tests."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["REL-003"]
action = "Set versions to 0.9.4 and add the changelog section."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-18
statement = "The owner approved fixing the pending-operation deadlock after a refused commit message and publishing the fix as patch release 0.9.4."
