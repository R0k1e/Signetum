[change]
schema_version = 1
id = "release-coherence"
[change.source]
kind = "human_direction"
summary = "Iterate the repository until coherent, clear, concise and releasable, addressing the reviewed workflow, dependency, documentation and distribution gaps."
[change.contract]
version = 3
approved_base = "93a9ccb2e0497327d7c9baf47bece2c730a23e4b"
[[change.contract.requirements]]
id = "REL-001"
outcome = "Hosted and local validation use one declared check graph."
acceptance = ["Extend the existing diagnostic command with mutually exclusive shard or gate selection; gate execution uses strict declared dependency order, rejects native argument forwarding, requires no workspace or approval, propagates failures and emits no readiness receipt. CI and release invoke that owner with the final gate."]
[[change.contract.requirements]]
id = "REL-002"
outcome = "Release prerequisites, identity and diagnostics are explicit."
acceptance = ["CI and release share one reusable preparation and validation workflow, declare the native Node/Rust acceptance dependencies, retain failed check output as an ordinary bounded-retention artifact, and keep publication separately authorized. Prepare product version 0.3.0, current package metadata and release notes; build and inspect the exact wheel and sdist."]
[[change.contract.requirements]]
id = "REL-003"
outcome = "Maintained documentation describes one current workflow."
acceptance = ["Correct contribution, parallel delivery, security and architecture descriptions; remove the obsolete public upgrade guide and old Skill replacement instructions; document actual prerequisites and release steps once, link their owners, preserve significant history and avoid a new review/report document."]
[[change.contract.requirements]]
id = "REL-004"
outcome = "Prove the current product path and prepare exact delivery."
acceptance = ["Extend existing public diagnostic behavior tests rather than duplicate lifecycle matrices; validate installed Skill and new/existing project cold starts, complete required member/final checks, and inspect hosted validation when an authorized review branch is available. Report any external publication configuration that cannot be proven without account authority, and present generated review before delivery."]
[[change.contract.requirements]]
id = "REL-005"
outcome = "Protocol workspaces stay under the primary repository and have coherent lifecycle state."
acceptance = ["Use an explicit contained .worktrees destination independent of caller and global defaults; reject escapes and collisions before preparation. Remove inspected unused linked trees and migrate required ones with Git while preserving user state. Registration uses stable member identity, retires removed workspaces and permits safe recreation without rewriting a live base. Exclude runtime trees from source discovery, checks and artifacts."]
[[change.contract.requirements]]
id = "REL-006"
outcome = "Only the current change record and significant source journal authorize new development."
acceptance = ["Retire executable legacy Review/Specification/Plan and ledger/migration command paths, retaining historical evidence and all unfinished commitments. Derive current clause decisions from preserved rationale rather than a second handwritten summary."]
[[change.contract.requirements]]
id = "REL-007"
outcome = "One verdict core and scoped test evidence make daily development efficient without weakening complete validation."
acceptance = ["Unify finding, waiver, first-failure and dependency verdicts across exact gates and diagnostics while keeping receipt authorization separate. Enable conservative self-selection, whole modified test files and unknown-input fallback. Enforce complete coverage on the complete collection, not a partial platform or selected subset. Correct parallel timing, consolidate duplicated pure matrices, clear stale build outputs and retain meaningful independent installed/native acceptance."]
[change.contract.autonomy]
allowed = ["Implement and verify the reviewed coherence fixes, prepare environment and build artifacts, and prepare reviewable delivery. Run hosted validation on candidate branches and deliver the reviewed exact candidate to main after presenting the generated delivery review. Remove verified unused worktrees; migrate required worktrees without losing user state."]
requires_confirmation = ["Create or push a release tag, publish packages, change publishing account configuration, or modify Perdura."]
[[change.contract.excluded]]
statement = "Perdura adoption, RAM volumes, background deletion, legacy format compatibility and a new diagnostic/report subsystem."
reason = "Keep the release focused on the current supported product and existing execution owners."

[[change.contract.retirements]]
id = "release-coherence/retire-perdura-adoption-boundaries-markdown-rule-boundary"
target = "perdura-adoption-boundaries/markdown-rule-boundary"
resolution_id = "perdura-adoption-boundaries/markdown-rule-verified"
targets = ["tests/integration/test_migration_preview.py"]
reason = "Retire exactly the legacy migration or single-caller action evidence removed by the owner-approved cleanup; preserve the original answer and all other evidence."

