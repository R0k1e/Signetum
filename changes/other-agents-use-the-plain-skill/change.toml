[[change.contract.decisions.topics]]
expected_version = 2

[change.contract.decisions.topics.revision]
id = "skill-installation"
version = 3
summary = "The plugin carries the Skill and guard for Claude Code and Codex; other agent tools use the same Skill folder as a plain Skill. The engine environment lives outside both."
boundaries = [
    "One manifest format and one published evidence schema digest.",
    "Host plugin managers own plugin copies; Signetum rewrites only a plain Skill folder, in place, and never one inside a Git work tree.",
    "The plugin directory receives no generated runtime files.",
]

[[change.contract.decisions.clauses]]
id = "other-agents-use-the-plain-skill/amend-installation"
change_id = "other-agents-use-the-plain-skill"
