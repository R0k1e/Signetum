[[change.contract.decisions.clauses.updates]]
id = "INSTALL-ENTRY-001"
version = 3
topic = "skill-installation"
scope = [
    "Repository manifest format",
    "Plugin update",
    "Plain Skill update",
]
statement = "Manifest format stays 5. Omitted evidence fields mean the published evidence protocol and schema digest, and an explicit digest must equal that schema. update reads the released marketplace pin on the delivery branch, verifies the pinned Skill against its release metadata, prepares that candidate's environment and checks the project manifest. A Skill inside a signetum plugin tree is a plugin install: update then upgrades every host that has signetum@signetum installed through its own plugin manager and preserves a Codex user setting that disabled it. Any other Skill folder is a plain install: update replaces that folder in place from a staged sibling copy, rolls back a failed swap, verifies the result and runs no host command; a plain folder inside a Git work tree is refused. An equal Skill digest or an older pin changes nothing, an incompatible manifest returns migration_required before any host command or replacement, and --check stays read-only. There is no --to, --source, version storage or entry switch. The updater never edits the project. Skill content identity and engine implementation identity stay separate and share one labeled digest function."
rationale = "A plain Skill has no host manager to replace it, so the updater is its only update path; the runtime is keyed by engine fingerprint rather than install path, so an in-place swap needs no version directory or entry link and the candidate's prepared environment serves the replaced folder at once. The plugin marker is part of the shipped tree and absent from the released Skill archive, so location decides the kind without configuration. Refusing a Git work tree keeps a project-local or checkout Skill under the repository's own history."

[[change.contract.decisions.clauses.updates]]
id = "SKILL-ENTRY-001"
version = 3
topic = "skill-first-development"
scope = [
    "Distribution entry",
]
statement = "Signetum is distributed from one tree, plugins/signetum. Claude Code and Codex install it as the signetum plugin, carrying the standard signetum Skill (loaded as signetum:signetum) and the command guard, and must not also install the plain Skill. Every other agent tool uses the plain Skill: the same plugins/signetum/skills/signetum folder installed as an ordinary Agent Skill directory, without the guard. Without the guard, receipts and batch-deliver as the only operation that advances the delivery branch still carry the protocol guarantees; the guard adds early refusal of work-losing commands. New and existing projects share one explicit local adoption path. Internal scaffold materials are not a second public product."
rationale = "Only Claude Code and Codex have a plugin manager and hook surface Signetum supports; the Skill folder is already a standard Agent Skill, so other tools use it unchanged instead of a second copy. Installing both in one host would list two Skills."

[[change.contract.decisions.clauses.updates]]
id = "PRODUCT-DISTRIBUTION-001"
version = 3
topic = "product-foundations"
scope = [
    "Distribution and use",
]
statement = "Keep installation, distribution and use simple: one plugin installed by the Claude Code and Codex plugin managers, the same standard Skill folder as a plain Skill for other agent tools, and repository-owned instructions and commands. Position for reliable development with large agent teams using concrete cases and accurately bounded evidence."
rationale = "The host plugin manager is the installation path Claude Code and Codex users already have and carries the guard; other tools already read standard Skill folders."

[change.contract.autonomy]
allowed = [
    "Extend scripts/update.py with install-kind detection and the in-place plain Skill replacement, keeping the plugin path unchanged.",
    "Extend the installed-copy and update traversals in tests/integration/test_built_distribution.py with plain Skill copies.",
    "Reconcile SKILL.md, the adoption reference, the command registry help, README, QUICKSTART, architecture pages and the unreleased 0.3.4 changelog.",
    "Run ready for this workspace.",
]
requires_confirmation = [
    "Batch admission, final, delivery, release, tagging or committing a marketplace pin.",
    "Editing ~/.claude, ~/.codex, ~/.local/share/signetum-marketplace or any installed Skill.",
]

[[change.execution.steps]]
id = "STEP-001"
requirements = ["PLAIN-001", "UPDATE-002"]
action = "Detect the install kind in update.py, add the staged in-place plain replacement with its Git work-tree refusal, report the kind, and extend the installed-copy and update traversals with plain copies."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["DOC-002"]
action = "Reconcile SKILL.md, adoption.md, the command registry help, README, QUICKSTART, architecture and the 0.3.4 changelog with both install kinds and the guarantee difference."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-05
source = "The owner, through the coordinating agent, decided that Claude Code and Codex get special support through the plugin and every other agent tool uses the plain Skill from the one Skill folder; asked for a supported plain install path, an update that detects plugin versus plain installs and updates a plain folder in place with the same compatibility check, docs forbidding a duplicate plain Skill for Claude Code and Codex users, a plain statement of the guarantee difference without the guard, and functional tests; and asked for ready without batch, release, tag or marketplace pin."
contract_digest = "sha256:242d5f8ab56e86097b4d8826c80b41c4f01fd7267d7b5fb737e3e8d7354c6e5b"
