[change]
schema_version = 1
id = "other-agents-use-the-plain-skill"

[change.source]
kind = "human_direction"
summary = "The owner decided that Claude Code and Codex keep their special support through the signetum plugin (Skill, command guard, plugin-manager updates and project-scope enablement) and that every other agent tool, such as OpenClaw, Grok, Gemini CLI or Cursor, uses the plain Skill: the same plugins/signetum/skills/signetum folder installed as an ordinary Agent Skill directory, without the guard, with no second copy in the repository. signetum-ships-as-a-plugin removed the standalone Skill install and update --to/--source, so those tools currently have no supported install or update path; the release already ships that folder as signetum-skill-<version>.zip."

[change.contract]
version = 1
approved_base = "37ad04e43eb3e66dfb1d14cec5ff5f4526479c13" # pragma: allowlist secret

[[change.contract.requirements]]
id = "PLAIN-001"
outcome = "The Skill folder plugins/signetum/skills/signetum, copied on its own into any directory or unpacked from signetum-skill-<version>.zip, is a supported plain Skill install: setup prepares the shared runtime and identity and status run from it, without the plugin manifest, hooks or a host plugin manager. The repository keeps one Skill source."
acceptance = [
    "A Skill folder copied alone into a temporary agent skills directory runs setup, identity and status in a Git project and shares the plugin copy's prepared environment.",
    "The repository contains no second Skill tree.",
]

[[change.contract.requirements]]
id = "UPDATE-002"
outcome = "update decides the install kind from the Skill's location: a Skill inside a signetum plugin tree (../../.claude-plugin/plugin.json naming signetum) is a plugin install and keeps the host plugin manager path unchanged; any other Skill folder is a plain install. A plain update reads the same released marketplace pin and verified archive, prepares the candidate and runs the same project manifest check, then replaces the Skill folder in place through a staged sibling copy and two renames, with rollback when the second rename fails, and verifies the replaced folder's identity. It runs no host command. A plain Skill folder inside a Git work tree is refused before download, so the updater never edits a project or checkout. update and update --check report the install kind. No version storage or entry switch is reintroduced."
acceptance = [
    "With a served pin, metadata and archive for a changed Skill and fake claude and codex on PATH that report the plugin installed, update on a plain copy returns updated with install plain, leaves the folder with the candidate's content digest and no staging or backup siblings, invokes no host command, and the replaced folder's identity runs.",
    "An incompatible project manifest returns migration_required and leaves the plain folder's content unchanged.",
    "A pin equal to the installed digest returns current; a plain copy inside a Git work tree is refused and unchanged.",
    "The existing plugin update traversal still drives exactly the four host commands and reports install plugin.",
]

[[change.contract.requirements]]
id = "DOC-002"
outcome = "SKILL.md, the adoption reference, README, QUICKSTART, the architecture pages and the unreleased 0.3.4 changelog describe both install kinds: Claude Code and Codex users install the plugin and must not also install the plain Skill; other agent tools copy or unpack the Skill folder into their skills directory, or point the tool at it, run setup and update with update. They state plainly that without the guard the protocol guarantees still come from receipts and batch-deliver being the only operation that advances the delivery branch, and that the guard only adds early refusal of work-losing commands."
acceptance = [
    "The documents name the plain Skill for other tools, the no-duplicate rule for Claude Code and Codex, the in-place update and the guarantee difference.",
]

