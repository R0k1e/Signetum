review:
  schema_version: 1
  id: foundation-v2-bootstrap
  status: active
  recorded_at: 2026-08-28
  source:
    kind: human_direction
    summary: >-
      Convert the former Python CI/CD template into a versioned development
      foundation, close the requirement-to-acceptance lifecycle, and let PyLM
      adopt immutable releases without migrating legacy specifications or plans.

  clauses:
    - id: FIND-001
      statement: The repository becomes a versioned development foundation rather than an application template.
    - id: FIND-002
      statement: Generic development mechanisms have one upstream authority while repository facts remain downstream-owned.
    - id: FIND-003
      statement: New requirements are traceable through Review, Specification, Plan, evidence, delivery, and acceptance or reopening.
    - id: FIND-004
      statement: An approved Specification cannot be narrowed by a Plan, dispatch brief, or implementation convenience.
    - id: FIND-005
      statement: Member-ready, batch-integrated, delivered, and human-accepted are distinct derived states.
    - id: FIND-006
      statement: Foundation releases publish immutable package, schema, and repo-dev skill identities.
    - id: FIND-007
      statement: Downstream repositories explicitly adopt a pinned release rather than following an upstream branch.
    - id: FIND-008
      statement: CI is check-only and never auto-fixes, auto-merges, or deletes development branches.
    - id: FIND-009
      statement: Technology policy is selected through profiles instead of being imposed by the generic foundation.
    - id: FIND-010
      statement: PyLM keeps legacy specs/ and plans/ unchanged while all new work uses change packages.
    - id: FIND-011
      statement: PyLM retains its validation, delivery, architecture, decisions, and exact eight public lifecycle operations.
    - id: FIND-012
      statement: Plans stay outside main while active and land with delivered implementation as durable provenance.

  acceptance:
    result: pending
    delivery_commit: null
    accepted_clauses: []
    rejected_clauses: []
