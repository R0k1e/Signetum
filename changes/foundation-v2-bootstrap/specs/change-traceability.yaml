specification:
  schema_version: 1
  id: foundation-v2-bootstrap/change-traceability
  version: 1
  status: approved
  implementation_authorized: true
  review:
    id: foundation-v2-bootstrap
    clauses: [FIND-003, FIND-005]
  decisions:
    - docs/decisions/ADP-change-packages-close-requirements.md
  plan: changes/foundation-v2-bootstrap/plans/change-traceability-plan.md

  intent:
    - make requirement coverage and closure machine-queryable
    - distinguish code validation, integration, delivery, and human acceptance

  models:
    review:
      owns:
        - source requirements and atomic clause identities
        - approved exclusions
        - delivery-linked acceptance, rejection, and reopening
      does_not_own:
        - technical behavior
        - implementation sequence
    specification:
      owns:
        - one current owner relation for each claimed clause
        - observable behavior and boundaries
        - structured deferral and supersession
      does_not_own:
        - hand-written implementation or delivery state
    plan:
      owns:
        - approved base
        - exhaustive obligations and evidence mapping
      does_not_own:
        - requirement or behavior changes

  derived_states:
    - specified
    - implementing
    - ready
    - integrated
    - delivered
    - accepted
    - reopened
    - excluded

  invariants:
    - every active clause has exactly one current approved Specification owner
    - every owned clause maps to at least one Plan obligation
    - every deferred clause transfers to an existing approved Specification
    - a superseded Specification owns no current clause
    - accepted and excluded clauses carry explicit human authority
    - parent item state is no more complete than its least-complete clause
    - implementation, integration, and delivery states come from typed evidence

  failure_contracts:
    - missing, duplicate, unknown, or superseded owners fail
    - a dangling Plan, decision, delivery, deferral, or reopen reference fails
    - an unsupported schema major fails
    - an acceptance without a delivery identity fails
    - a newly added file under a declared legacy root fails

  output:
    stdout: one versioned JSON object
    stderr: bounded diagnostics containing file, field path, and reason
    success_exit: 0
    invocation_error_exit: 2
    validation_failure_exit: 3
    internal_failure_exit: 4

  acceptance:
    - fixture traversals cover one complete accepted change and each failure family
    - status projection consumes a typed evidence provider rather than PyLM internals
    - static validation can run independently and be composed into one repository final gate
