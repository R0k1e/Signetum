specification:
  schema_version: 1
  id: foundation-v2-bootstrap/repo-dev-agent-contract
  version: 1
  status: approved
  implementation_authorized: true
  review:
    id: foundation-v2-bootstrap
    clauses: [FIND-004]
  decisions:
    - docs/decisions/ADP-change-packages-close-requirements.md
  plan: changes/foundation-v2-bootstrap/plans/repo-dev-agent-contract-plan.md

  intent:
    - make repo-dev enforce requirement closure without embedding downstream facts
    - prevent operational convenience from silently narrowing approved behavior

  required_agent_behavior:
    - resolve change, specification, plan, and legacy authorities from the repository manifest
    - read affected Review clauses before drafting or changing a Specification
    - require human confirmation for new behavior and accepted decisions for durable process changes
    - prove that Plan obligations exhaust every clause owned by the approved Specification
    - treat dispatch briefs as selections of obligations rather than scope authorities
    - transfer a deferred clause to another approved Specification before continuing
    - report ready, integrated, delivered, and accepted separately
    - create reopen or supersession history instead of rewriting accepted history

  skill_boundary:
    generic:
      - lifecycle decisions and stopping conditions
      - manifest-driven routing
      - requirement closure and completion-state semantics
      - validation, delivery, and recovery authority boundaries
    downstream:
      - concrete paths and branches
      - selected profiles
      - public task operations
      - product architecture, tests, and delivery topology

  forbidden_behavior:
    - hard-coding changes/, specs/, plans/, origin/product, PyLM, or a test selector in generic instructions
    - declaring a whole Plan complete after dispatching only selected obligations
    - using an agent report as completion evidence
    - treating installation of a newer skill as downstream authorization to change behavior
    - adding generic advice that does not change a material agent decision

  acceptance:
    - skill-creator structural validation passes
    - every referenced skill resource exists and has an explicit routing reason
    - an independent forward case refuses to close a half-implemented approved Specification
    - an independent forward case reads repository paths from a supplied manifest
