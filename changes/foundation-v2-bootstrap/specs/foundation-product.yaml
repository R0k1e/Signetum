specification:
  schema_version: 1
  id: foundation-v2-bootstrap/foundation-product
  version: 1
  status: approved
  implementation_authorized: true
  review:
    id: foundation-v2-bootstrap
    clauses: [FIND-001, FIND-002, FIND-009, FIND-012]
  decisions:
    - docs/decisions/ADP-template-becomes-versioned-development-foundation.md
    - docs/decisions/ADP-change-packages-close-requirements.md
  plan: changes/foundation-v2-bootstrap/plans/foundation-product-plan.md

  intent:
    - replace the generated-application template with a reusable versioned foundation
    - keep generic mechanisms upstream and repository facts downstream
    - select technology policy through profiles
    - keep active Plans isolated and delivered Plans durable

  inputs:
    - a repository specialization manifest
    - a supported foundation release identity
    - selected profile identifiers
  outputs:
    - validated repository authority bindings
    - packaged schemas, profiles, CLI, and evidence interfaces

  invariants:
    - the generic package contains no PyLM path, branch, application, or test selector
    - repository facts are loaded through a validated downstream manifest
    - an active Plan cannot mutate the delivery branch
    - a delivered implementation retains its Plan in the same repository history
    - one profile cannot silently activate another profile

  scenarios:
    - id: select-python-and-git-profiles
      given: a repository manifest selecting python-uv and git-worktrunk
      when: the foundation validates and loads the manifest
      then:
        - only those profiles and explicitly required shared profiles are active
        - repository paths come from the manifest
    - id: reject-unsupported-manifest
      given: a manifest declaring an unsupported major schema
      when: foundation validation runs
      then:
        - validation fails with the unsupported identity
      forbidden:
        - interpreting the file with the newest available schema

  removed_or_forbidden:
    - placeholder application generation as the foundation product
    - unconditional Lagom, Hydra, transitions, returns, uvloop, Node, or Rust policy
    - a current-state architecture page describing behavior not yet delivered
    - a compatibility mode that keeps both template and foundation products active

  acceptance:
    - package build contains the declared schemas and profile resources
    - manifest validation has positive and negative public-boundary tests
    - active and delivered Plan behavior is stated by repository lifecycle tests
