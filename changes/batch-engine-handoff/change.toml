[change]
schema_version = 2
id = "batch-engine-handoff"

[change.source]
kind = "human_direction"
summary = "A downstream batch of eleven members was pinned to engine 0.9.5, whose final could not complete it, and the fixed engine was refused by the pin; the only remedy was to abandon the batch and admit the same members again. In the same work an agent committed with an overridden hooks path, so the commit check never ran, and nothing later said so. The owner directed that both be handled now and that the remedy stay simple."

[change.contract]
version = 1
approved_base = "daf3f11d1debffbb9d1a57f8c2d9328a012d143f" # pragma: allowlist secret

[[change.contract.requirements]]
id = "PIN-001"
outcome = "An updated installed Skill operates a batch that an earlier installed Skill opened: admission, final and delivery proceed without a refusal, a new command or a reopened batch. The batch keeps recording the engine that opened it and each operation the engine that ran it, and final evidence produced by a different engine than the one now running is not reused, so final runs again. An engine from a foreign checkout is still refused."
acceptance = [
    "A batch opened by one installed engine identity and continued by another is admitted to, passes final and is delivered with no extra step.",
    "A final receipt produced under the earlier identity is not accepted for delivery under the new one.",
    "A foreign checkout engine is refused for batch-open and for operating a batch as today.",
]

[[change.contract.requirements]]
id = "UNCHECKED-002"
outcome = "Ready and final refuse a member or batch that contains a commit made after the workspace was registered for which no commit check ran, naming the commit, and say how to correct it; commits the check judged are unaffected."
acceptance = [
    "A commit made with an overridden hooks path on a registered member is refused by ready with the commit named, and passes after it is recreated through the hook.",
    "Merges recorded by Signetum operations and commits made before registration are not refused.",
]

[[change.contract.requirements]]
id = "REL-003"
outcome = "Release 0.9.7 carries both with the package and Skill versions and the changelog updated."
acceptance = ["Package and Skill versions agree on 0.9.7 and the changelog has a 0.9.7 section."]

[change.contract.autonomy]
allowed = [
    "Change the engine pin check, the commit check evidence, ready and final, their tests and the affected guidance within these outcomes.",
]
requires_confirmation = [
    "Changing a record or manifest schema in a way older engines cannot read, loosening the command guard, publishing a release, or running update or install against an installed Skill.",
]

[[change.contract.decisions]]
id = "batch-engine-handoff/owner"
change_id = "batch-engine-handoff"
authority = "changes/batch-engine-handoff/change.toml#decisions/batch-engine-handoff/owner"
parents = ["engine-pin-and-hook-chain/engine-and-hook"]
reason = "The pin was added because a mutable foreign checkout engine invalidated running validation. That case is closed by refusing foreign checkout engines, which stays. Refusing a newer installed Skill adds nothing to it: an installed Skill is an immutable released engine, member evidence is unpinned, and the only batch-level evidence is final, which is bound to the engine that produced it and simply runs again. The refusal instead turned a tool repair into abandoning a batch and admitting eleven members again. An owner-authorized handoff operation was considered and rejected as machinery for a case that needs none. Detecting unchecked commits at ready belongs here because a hook cannot stop a caller that overrides the hooks path, and immutable attribution was named as the backstop without a gate that reads it. Reopen if an installed engine update is found to carry stale batch evidence into delivery."

[[change.execution.steps]]
id = "STEP-001"
requirements = ["PIN-001"]
action = "Stop refusing an installed Skill engine that differs from the batch's opening engine, and bind final evidence to the engine that produced it."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["UNCHECKED-002"]
action = "Make ready and final refuse commits that no commit check judged, with regression tests."

[[change.execution.steps]]
id = "STEP-003"
requirements = ["REL-003"]
action = "Set versions to 0.9.7 and add the changelog section."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-25
statement = "On 2026-11-25 the owner directed that what remains wrong in Signetum after the 0.9.6 repair be handled without waiting, and that the engine pin remedy stay simple."
