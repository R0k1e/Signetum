[change]
schema_version = 1
id = "engine-changes-keep-sibling-evidence"

[change.source]
kind = "human_direction"
summary = "Delivering owed-nodes-run-first and stacked-members in one batch exposed two engine gaps. After owed-nodes-run-first, which adds the shard field after, entered the batch, no engine could admit stacked-members: the batch engine rejected its ready receipt because the signetum-engine implementation digest differed, and the member's and main's engines rejected the batch manifest with unknown dataclass fields. The member had to synchronize the batch and run ready again (observation stacked-members/sibling-engine-evidence/observation). Separately, every member ready and admission gate since at least 2026-11-03 records baseline_unavailable for the engine:ty and engine:traceability ratchets: the baseline is measured with uv run --active --no-project in a materialized tree without a project environment while VIRTUAL_ENV is removed, so the module signetum is missing and the ratchet silently compares against an empty baseline. The owner approved fixing both. Scope note: resolving that observation also showed that a deferral can only transfer whole requirements, so a finding narrower than the requirement it names cannot be deferred to this change; the member resolved it instead, naming SIBLING-EVIDENCE-001 as the owner of the general gap. Carrying another change's record turns a member into its implementer: while stacked-members carried this approved record, ready refused it as plan stage until an implementation commit followed, so the record was removed from that member again. Resolution evidence must exist in the member's own tree: ready refused the resolution citing this record once the member no longer carried it, so a resolution cannot cite a follow-up change's record unless the member carries it."

[change.contract]
version = 1
approved_base = "b847d736d6137466728ebfe22ef5efbab54d3306" # pragma: allowlist secret

[[change.contract.requirements]]
id = "SIBLING-EVIDENCE-001"
outcome = "An engine or manifest-schema change carried by one member does not strand its sibling members. A ready sibling whose evidence was produced by an older engine can be admitted into a batch that already holds that change through a supported, inexpensive path that requalifies or carries its evidence, without hand-applied diffs or history rewriting, and without accepting evidence whose checked inputs changed."
acceptance = [
    "A batch that admitted a member changing the engine source and the manifest schema admits a second, independently ready member through the supported path, and the batch gate runs over the merged result.",
    "The supported path does not rerun checks whose inputs are unchanged, and refuses carried evidence when the sibling's own checked inputs differ.",
    "Lifecycle operations that read a batch manifest name the supported path instead of failing only with an unknown manifest field.",
]

[[change.contract.requirements]]
id = "RATCHET-BASELINE-001"
outcome = "A ratchet measures its baseline in an environment where the project is installed, so the baseline diagnostic command executes. When the baseline cannot be measured, the gate fails loudly with the cause instead of passing against an empty baseline."
acceptance = [
    "A member gate over this repository records a measured engine:ty and engine:traceability baseline with no baseline_unavailable.",
    "A baseline command that cannot execute fails the shard, naming the cause, even when the current tree has no diagnostics.",
]

[[change.contract.requirements]]
id = "CLAIM-SCOPE-001"
outcome = "Admission counts a member's decision clause claims only from the member's own contribution, excluding verified synchronized upstream content, so a member that synchronized delivered change records is not refused when a batch sibling amends one of their clauses."
acceptance = [
    "A member that synchronized a delivery tip carrying a delivered change record is admitted into a batch whose sibling amends a clause that record wrote.",
    "Two members whose own change records write one clause identity are still refused before merging.",
]

[change.contract.autonomy]
allowed = [
    "Extend the existing admission, evidence identity, workspace synchronization, ratchet and environment owners, and remove checks they replace.",
    "Extend existing public lifecycle and ratchet traversals, reconcile the Skill references, validation architecture and changelog, and run ready.",
]
requires_confirmation = [
    "Accept evidence whose checked inputs changed, weaken a ratchet, integrate a batch, publish or deliver.",
]

[[change.execution.steps]]
id = "STEP-001"
requirements = ["SIBLING-EVIDENCE-001"]
action = "Reproduce the stranded sibling through public lifecycle traversals, then extend admission and evidence identity so an engine or schema change in one member keeps a supported requalification path for its siblings."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["RATCHET-BASELINE-001"]
action = "Reproduce the empty baseline through the ratchet traversal, measure the baseline in a project environment and fail on an unavailable baseline; reconcile current instructions."

[[change.execution.steps]]
id = "STEP-003"
requirements = ["CLAIM-SCOPE-001"]
action = "Reproduce the refused admission of a member that synchronized delivered change records, then restrict member clause claims to the member's own contribution."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-07
source = "The owner approved a follow-up change fixing the sibling-evidence gap and the silent ratchet baseline, and on 2026-11-07 decided to fold in the decision clause claim false positive found while admitting this member, both relayed by the coordinating session."
contract_digest = "sha256:cb7ffeb9a0dde4890e3d671f5eeca7919ede85bc6fc7a4bfb599615978012896"
