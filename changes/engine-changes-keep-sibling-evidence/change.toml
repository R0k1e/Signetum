[change]
schema_version = 1
id = "engine-changes-keep-sibling-evidence"

[change.source]
kind = "human_direction"
summary = "Delivering owed-nodes-run-first and stacked-members in one batch exposed two engine gaps. After owed-nodes-run-first, which adds the shard field after, entered the batch, no engine could admit stacked-members: the batch engine rejected its ready receipt because the signetum-engine implementation digest differed, and the member's and main's engines rejected the batch manifest with unknown dataclass fields. The member had to synchronize the batch and run ready again (observation stacked-members/sibling-engine-evidence/observation). Separately, every member ready and admission gate since at least 2026-11-03 records baseline_unavailable for the engine:ty and engine:traceability ratchets: the baseline is measured with uv run --active --no-project in a materialized tree without a project environment while VIRTUAL_ENV is removed, so the module signetum is missing and the ratchet silently compares against an empty baseline. The owner approved fixing both. Scope note: resolving that observation also showed that a deferral can only transfer whole requirements, so a finding narrower than the requirement it names cannot be deferred to this change; the member resolved it instead, naming SIBLING-EVIDENCE-001 as the owner of the general gap."

[change.contract]
version = 1
approved_base = "b847d736d6137466728ebfe22ef5efbab54d3306" # pragma: allowlist secret

[[change.contract.requirements]]
id = "SIBLING-EVIDENCE-001"
outcome = "An engine or manifest-schema change carried by one member does not strand its sibling members. A ready sibling whose evidence was produced by an older engine can be admitted into a batch that already holds that change through a supported, inexpensive path that requalifies or carries its evidence, without hand-applied diffs or history rewriting, and without accepting evidence whose checked inputs changed."
acceptance = [
    "A batch that admitted a member changing the engine source and the manifest schema admits a second, independently ready member through the supported path, and the batch gate runs over the merged result.",
    "The supported path does not rerun checks whose inputs are unchanged, and refuses carried evidence when the sibling's own checked inputs differ.",
    "Lifecycle operations that read a batch manifest name the supported path instead of failing only with an unknown manifest field.",
]

[[change.contract.requirements]]
id = "RATCHET-BASELINE-001"
outcome = "A ratchet measures its baseline in an environment where the project is installed, so the baseline diagnostic command executes. When the baseline cannot be measured, the gate fails loudly with the cause instead of passing against an empty baseline."
acceptance = [
    "A member gate over this repository records a measured engine:ty and engine:traceability baseline with no baseline_unavailable.",
    "A baseline command that cannot execute fails the shard, naming the cause, even when the current tree has no diagnostics.",
]

[change.contract.autonomy]
allowed = [
    "Extend the existing admission, evidence identity, workspace synchronization, ratchet and environment owners, and remove checks they replace.",
    "Extend existing public lifecycle and ratchet traversals, reconcile the Skill references, validation architecture and changelog, and run ready.",
]
requires_confirmation = [
    "Accept evidence whose checked inputs changed, weaken a ratchet, integrate a batch, publish or deliver.",
]

[[change.execution.steps]]
id = "STEP-001"
requirements = ["SIBLING-EVIDENCE-001"]
action = "Reproduce the stranded sibling through public lifecycle traversals, then extend admission and evidence identity so an engine or schema change in one member keeps a supported requalification path for its siblings."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["RATCHET-BASELINE-001"]
action = "Reproduce the empty baseline through the ratchet traversal, measure the baseline in a project environment and fail on an unavailable baseline; reconcile current instructions."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-07
source = "The owner approved a follow-up change fixing the sibling-evidence gap and the silent ratchet baseline, relayed by the coordinating session on 2026-11-07."
contract_digest = "sha256:03b4e4216f7d8c33913c7a80f25e4d4f0afb0aa93a39eb5b81bca9f3ec8c1a0c"
