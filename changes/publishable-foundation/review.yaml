review:
  schema_version: 1
  id: publishable-foundation
  status: active
  recorded_at: 2026-08-30
  source:
    kind: human_direction
    summary: >-
      Present the standalone Foundation Template as a publishable product whose
      public materials explain requirement closure, repository comprehension,
      efficient batch validation, parallel Agent work, delivery provenance,
      and behavior-oriented quality.

  clauses:
    - id: PUBLISH-001
      statement: The public product position explains the outcome Foundation provides and the failure modes it addresses.
    - id: PUBLISH-002
      statement: A first-time adopter can create a repository and complete one governed change through documented commands.
    - id: PUBLISH-003
      statement: Review, Specification, Plan, decision, validation evidence, delivery, and acceptance have distinct documented boundaries.
    - id: PUBLISH-004
      statement: Agent Team parallelism, isolated worktrees, staged validation, frozen batch validation, and explicit delivery are explained end to end.
    - id: PUBLISH-005
      statement: A delivery exposes the requirements, plans, members, exact validated tree, and resulting delivery identity.
    - id: PUBLISH-006
      statement: Quality documentation distinguishes behavior contracts, unit tests, integration tests, and implementation-detail assertions.
    - id: PUBLISH-007
      statement: The Template documents customization, independence after creation, contribution, security, and support boundaries.
    - id: PUBLISH-008
      statement: Repository-owned validation rejects broken public documentation references and incomplete product-surface assets.

  acceptance:
    result: pending
    delivery_commit: null
    accepted_clauses: []
    rejected_clauses: []
