specification:
  schema_version: 1
  id: publishable-foundation/product-surface
  version: 1
  status: approved
  implementation_authorized: true
  review:
    id: publishable-foundation
    clauses:
      - PUBLISH-001
      - PUBLISH-002
      - PUBLISH-003
      - PUBLISH-004
      - PUBLISH-005
      - PUBLISH-006
      - PUBLISH-007
      - PUBLISH-008
  decisions:
    - docs/decisions/ADP-foundation-is-a-standalone-template.md
    - docs/decisions/ADP-foundation-has-a-public-product-surface.md
  plan: changes/publishable-foundation/plans/product-surface.md

  intent:
    - make the standalone Template understandable before adoption
    - let an adopter traverse one complete governed delivery without hidden knowledge
    - make public product claims correspond to repository-enforced behavior

  inputs:
    - the repository's architecture, policy, change, validation, and delivery authorities
    - a human requirement recorded as atomic Review clauses
  outputs:
    - a product-oriented README and discoverable documentation map
    - a runnable example change package
    - public contribution, security, and changelog boundaries
    - a check-only public-surface validator composed into repository validation

  invariants:
    - Foundation is described as a one-time GitHub Template and not as an upgrade service
    - no public claim promises perfect natural-language interpretation or defect-free software
    - every documented lifecycle command matches the eight repository operations
    - documentation links resolve to tracked repository files or explicit web URLs
    - the example demonstrates one Review clause with exactly one approved Specification owner and one Plan obligation
    - final validation runs once on a frozen batch and does not imply human acceptance
    - tests assert observable validation results rather than parser call order

  scenarios:
    - id: understand-and-adopt
      given: an engineer evaluating Foundation for an Agent-developed repository
      when: the engineer reads the README and Quickstart
      then:
        - the product outcome and limits are explicit
        - one complete change lifecycle can be followed through public commands
        - the produced delivery evidence is identifiable
    - id: reject-a-broken-product-surface
      given: a required public guide or repository-relative Markdown link is missing
      when: repository validation runs
      then:
        - validation fails with the missing path and reason
      forbidden:
        - silently ignoring the broken reference

  removed_or_forbidden:
    - describing the repository as a synchronized upstream dependency
    - claiming that an Agent's comprehension is proven merely by loading a manifest
    - claiming absolute prevention of missing requirements or defects
    - a second delivery runner or lifecycle alias for documentation convenience

  acceptance:
    - README states the product outcome, eight capabilities, limits, and primary call to action
    - Quickstart covers template creation through explicit delivery and acceptance
    - concept and workflow guides define all lifecycle authorities and one through-case
    - public-surface validation has positive and negative public-boundary tests
    - the complete repository gate passes on the final tree
