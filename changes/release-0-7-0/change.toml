[change]
schema_version = 1
id = "release-0-7-0"

[change.source]
kind = "human_direction"
summary = 'The owner explicitly requested integration, delivery and release of Signetum 0.7.0 on 2026-11-10. The delivered judge-at-the-action batch contains M1 action-time attribution, M2 retired test debt release, M3 engine pinning and hook-chain verification, M4 commit-time record checks, and M5 reachability debt discharge. The documented minor-version policy applies to these user-visible features. Retained release authorities are docs/maintainers/releasing.md, docs/decisions/ADP-reviewed-release-notes.md and changes/release-0-6-0/change.toml.'

[change.contract]
version = 1
approved_base = "2792024e90d924ccd55030a61fe24624167de8ff" # pragma: allowlist secret

[[change.contract.requirements]]
id = "RELEASE-001"
outcome = "The package, the Skill and the nested engine carry product version 0.7.0, and both lockfiles record that engine version."
acceptance = [
    "uv run python -m tools.cli release preflight on the delivered commit reports status valid with the package and Skill at 0.7.0 and the schema identity unchanged.",
    "The Skill metadata and skills/signetum/scripts/engine/pyproject.toml name 0.7.0 and no current product-version location names 0.6.0.",
]

[[change.contract.requirements]]
id = "NOTES-002"
outcome = "CHANGELOG.md finalizes the unreleased section as 0.7.0 with concise user outcomes covering M1 through M5 and the workspace-registration compatibility change, so the release workflow extracts the reviewed notes."
acceptance = [
    "CHANGELOG.md has a ## 0.7.0 section holding the former unreleased entries and no unreleased section.",
]

[[change.contract.requirements]]
id = "PUBLISH-003"
outcome = "The delivered release commit is tagged v0.7.0 and the hosted release workflow publishes it as a GitHub release."
acceptance = [
    "An annotated tag v0.7.0 on the delivered release commit is pushed and gh release view v0.7.0 shows the published Skill archive, release-source.json and SHA256SUMS.",
]

[change.contract.autonomy]
allowed = [
    "Edit the version locations, refresh both lockfiles for the engine version only, rename and condense the changelog section.",
    "Run ready, open a batch, admit this member, run final and deliver to main, push main and fix hosted CI failures through this change.",
    "Create and push the annotated tag v0.7.0 on the delivered commit after hosted CI passes, and let the release workflow publish it.",
]
requires_confirmation = [
    "Upgrade a dependency, publish a version other than 0.7.0, move a published tag or replace published artifacts.",
]

[[change.execution.steps]]
id = "STEP-VERSION"
requirements = ["RELEASE-001"]
action = "Set 0.7.0 in the engine pyproject and Skill metadata and relock both lockfiles without upgrading dependencies."

[[change.execution.steps]]
id = "STEP-NOTES"
requirements = ["NOTES-002"]
action = "Rename the unreleased changelog heading to 0.7.0 and keep its entries concise."

[[change.execution.steps]]
id = "STEP-VERIFY"
requirements = ["RELEASE-001", "NOTES-002"]
action = "Run ready subject to the shared-host load gate, integrate in an explicitly authorized release batch, run final, deliver and wait for hosted CI on the delivered commit."

[[change.execution.steps]]
id = "STEP-PUBLISH"
requirements = ["PUBLISH-003"]
action = "Tag the delivered commit v0.7.0 after successful hosted CI, push only that tag, verify public artifacts, Pages, isolated install/adoption and update --check from an old scratch Skill without updating the installed Skill."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-10
source = 'Repository owner approved release 0.7.0, batch final, delivery to main, pushing main and v0.7.0, and GitHub publication (2026-11-10). The structural plan and one 0.7.0 release were approved on 2026-11-09; the M5 failure-debt correction was approved on 2026-11-10. The current task supplies publication authority; no other publication is authorized.'
contract_digest = "sha256:1272040887b78e37b14cf67177ba5286ff525ba2252d24eb899a83c1661e8688"
