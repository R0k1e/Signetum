[change]
schema_version = 1
id = "signetum-ships-as-a-plugin"

[change.source]
kind = "human_direction"
summary = "The owner approved migrating Signetum from a standalone Skill to one plugin for Claude Code and Codex: the Skill plus a PreToolUse command guard, installed and updated by the host plugin managers. The feasibility study at 8def345 (Claude Code 2.1.318, codex-cli 0.166.0) showed both hosts read one plugin tree (.claude-plugin/plugin.json, hooks/hooks.json, CLAUDE_PLUGIN_ROOT) and that Codex binds hook trust to a hash of the whole plugin directory, so the Skill-local .runtime environment and its host-python symlink break trust; the current update would replace a host-managed copy with a symlink. Agents in Perdura and Signetum bypassed protocol operations with stash, destructive resets, direct merges and ad-hoc worktree removal, which only repository-specific hooks caught."

[change.contract]
version = 1
approved_base = "8def345c10682efa80817fa1a0508c918a54670d" # pragma: allowlist secret

[[change.contract.requirements]]
id = "RUNTIME-001"
outcome = "The locked engine environment lives in ${XDG_DATA_HOME:-~/.local/share}/signetum/runtime/<fingerprint>, keyed by the implementation digest, uv.lock and pyproject.toml and independent of the Skill path. setup and every command write nothing into the Skill or plugin directory except interpreter bytecode caches."
acceptance = [
    "With a test XDG_DATA_HOME, one Skill copied to two paths prepares one environment path, and identity and status run from both copies.",
    "After setup and a command, the Skill directory's file set, excluding __pycache__, is unchanged.",
    "A changed environment receipt or installed engine is still refused without repair.",
]

[[change.contract.requirements]]
id = "GUARD-001"
outcome = "The plugin's PreToolUse guard, a stdlib-only Python script behind a POSIX sh entry, reads Claude Code and Codex Bash payloads and exits 2 with one JSON line naming the category and the Signetum operation to use for stash, destructive reset, restore, clean, checkout -- or checkout ., forced checkout or switch, force push including --force-with-lease, +refspec and git -C forms, recursive forced rm of ., *, ~, / or $HOME, any git merge or rebase, wt step rebase or push, wt merge, git worktree add, move or remove, wt remove, wt switch -c or --create, git branch -D or --delete --force, and pre-commit run on a tree with unstaged changes. Read-only Git commands, git commit, git branch -d and text that only mentions these commands inside quotes or heredocs are allowed. It applies wherever the plugin is enabled, and a guard that cannot run allows the command."
acceptance = [
    "Captured-shape Claude and Codex PreToolUse payloads for every listed rule exit 2 with the expected category and an operation hint; git status, git log, git diff, git stash list, git branch -d, git commit and quoted, heredoc and echo mentions exit 0.",
    "Commands reached through sh -c, bash -lc, eval, env, command substitution, chained operators and git -C are classified like the plain command.",
    "pre-commit run exits 2 in a repository with an unstaged tracked change and 0 in a clean one, using the payload cwd.",
    "Without python3 on PATH, with malformed JSON or with a crashing guard, the entry exits 0.",
    "The guard runs under the system Python 3.9 when that interpreter is present.",
]

[[change.contract.requirements]]
id = "PLUGIN-001"
outcome = "The repository ships one plugin tree at plugins/signetum for both hosts: .claude-plugin/plugin.json with the engine version, hooks/hooks.json running the guard on Bash through ${CLAUDE_PLUGIN_ROOT}, and the Skill moved unchanged in role to plugins/signetum/skills/signetum, loaded as signetum:signetum. Development, release and repository paths follow the move."
acceptance = [
    "claude plugin validate accepts plugins/signetum.",
    "A session-only claude --plugin-dir plugins/signetum -p run in a scratch clone has a sentinel git stash blocked by the plugin hook, lets git status run and lists signetum:signetum, without changing ~/.claude settings.",
    "In a temporary CODEX_HOME with a scratch local marketplace, hooks/list shows the guard with its expanded plugin path and skills/list shows signetum:signetum.",
    "The launcher prepares and runs from the plugin's Skill path with the relocated runtime, and the member gate passes with the moved tree.",
]

[[change.contract.requirements]]
id = "ENABLE-001"
outcome = "Adoption enables the plugin at project scope for the adopted repository in the same reviewed preview as signetum.toml: .claude/settings.json gains enabledPlugins signetum@signetum and the signetum GitHub marketplace in extraKnownMarketplaces, and .codex/config.toml gains [plugins.\"signetum@signetum\"] enabled = true, preserving every other setting. Already-enabled files are unchanged and an explicit disable is refused for review."
acceptance = [
    "Adopting a repository without host settings previews and applies creation of signetum.toml, .claude/settings.json and .codex/config.toml.",
    "Existing unrelated Claude and Codex settings survive adoption, and a second preview of an adopted repository proposes no host-setting change.",
    "A project that disabled the plugin is refused before writing.",
    "A trusted project's .codex/config.toml enablement loads the plugin hook and skill only in that project in a temporary CODEX_HOME where the user setting disables it.",
]

[[change.contract.requirements]]
id = "UPDATE-001"
outcome = "sh <skill>/scripts/signetum update reads the released marketplace pin from main, verifies the pinned Skill against its release metadata, prepares the candidate environment and checks the project manifest, and then upgrades every host that has signetum@signetum installed through its plugin manager: claude plugin marketplace update signetum and claude plugin update signetum@signetum; codex plugin marketplace upgrade signetum and codex plugin add signetum@signetum. A Codex user setting that disabled the plugin stays disabled. It reports restart_required and, for Codex, codex_hook_review_required. update --check stays read-only. The standalone Skill install, update --to, update --source, version storage and entry switching are removed."
acceptance = [
    "With fake claude and codex on PATH and a served pin, metadata and archive for a changed Skill, update prepares the candidate and invokes exactly the four host commands, reporting restart_required and codex_hook_review_required.",
    "An incompatible project manifest returns migration_required and invokes no host update.",
    "A pin whose Skill digest equals the installed one returns current and invokes no host update; a host without signetum installed is skipped.",
    "A disabled Codex user setting is still disabled after the update.",
    "update --to and update --source are refused.",
]

[[change.contract.requirements]]
id = "RELEASE-001"
outcome = "Release tooling builds the Skill archive and component metadata from the plugin path, requires plugin.json to carry the package version, and writes the repository-root .claude-plugin/marketplace.json pin (git-subdir source, plugins/signetum path, tag ref and exact commit) only when a maintainer runs it for a release. This change commits no pin."
acceptance = [
    "Release metadata is built from plugins/signetum/skills/signetum and refused when plugin.json and the package version differ.",
    "The pin command writes a marketplace document naming the tag and 40-hex commit; the delivered tree has no .claude-plugin/marketplace.json.",
]

[[change.contract.requirements]]
id = "DOC-001"
outcome = "SKILL.md, the adoption reference, the architecture pages, README, QUICKSTART, CONTRIBUTING, the product site, the release guide and an unreleased 0.3.4 changelog section describe plugin installation through the host managers, project-scope enablement, the guard, the relocated runtime and the update path, with migration notes telling users to remove old standalone Skill copies."
acceptance = [
    "CHANGELOG.md has an unreleased 0.3.4 entry naming the plugin, guard, runtime location, update path and the removal of ~/.claude/skills/signetum and ~/.codex/skills/signetum copies; versions are not bumped.",
]

[[change.contract.decisions]]
id = "signetum-ships-as-a-plugin/plugin-distribution"
