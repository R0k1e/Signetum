expected_version = 1

[change.contract.decisions.topics.revision]
id = "skill-installation"
version = 2
summary = "One host-managed plugin carries the Skill and its command guard; the engine environment lives outside it."
boundaries = [
    "One manifest format and one published evidence schema digest.",
    "Host plugin managers own installed copies; Signetum never rewrites them.",
    "The plugin directory receives no generated runtime files.",
]

[[change.contract.decisions.topics]]
expected_version = 0

[change.contract.decisions.topics.revision]
id = "command-guard"
version = 1
summary = "A plugin PreToolUse guard refuses commands that lose work or bypass protocol operations."
boundaries = [
    "The guard applies wherever the plugin is enabled; it has no repository switch.",
    "A guard that cannot run allows the command.",
]

[[change.contract.decisions.clauses]]
id = "signetum-ships-as-a-plugin/amend-installation"
change_id = "signetum-ships-as-a-plugin"
action = "amend"
expected = [
    { id = "INSTALL-ENTRY-001", version = 1 },
    { id = "SKILL-ENTRY-001", version = 1 },
    { id = "PRODUCT-DISTRIBUTION-001", version = 1 },
]
reason = "A Signetum-owned entry switch and version storage conflict with host plugin managers, and a standalone Skill cannot carry a command hook."
authority = "changes/signetum-ships-as-a-plugin/change.toml#decisions/signetum-ships-as-a-plugin/plugin-distribution"

[[change.contract.decisions.clauses.updates]]
id = "INSTALL-ENTRY-001"
version = 2
topic = "skill-installation"
scope = [
    "Repository manifest format",
    "Plugin update",
]
statement = "Manifest format stays 5. Omitted evidence fields mean the published evidence protocol and schema digest, and an explicit digest must equal that schema. update reads the released marketplace pin on the delivery branch, verifies the pinned Skill against its release metadata, prepares that candidate's environment and checks the project manifest, then upgrades every host that has signetum@signetum installed through its own plugin manager and preserves a Codex user setting that disabled it. An equal Skill digest or an older pin changes nothing, an incompatible manifest returns migration_required before any host command, and --check stays read-only. There is no other install or update path: no standalone Skill install, --to, --source, version storage or entry switch. The updater never edits the project. Skill content identity and engine implementation identity stay separate and share one labeled digest function."
rationale = "Both hosts replace a plugin's versioned cache directory on update and Codex deletes the old one at once, so a Signetum-managed entry switch would point a host at content it did not install. Running the host commands after the compatibility check keeps one path that cannot skip a host; printing them would leave each upgrade to manual commands. Pinning the release commit in marketplace.json keeps ordinary merges to main from becoming releases."

[[change.contract.decisions.clauses.updates]]
id = "SKILL-ENTRY-001"
version = 2
topic = "skill-first-development"
scope = [
    "Distribution entry",
]
statement = "Signetum is distributed as the signetum plugin for Claude Code and Codex from one tree, plugins/signetum, carrying the standard signetum Skill (loaded as signetum:signetum) and the command guard. New and existing projects share one explicit local adoption path. Internal scaffold materials are not a second public product."
rationale = "Codex reads the Claude manifest, marketplace and hooks files and sets CLAUDE_PLUGIN_ROOT, so one tree serves both hosts; a hook can only ship inside a plugin, and the Skill stays the single instruction and execution entry inside it."

[[change.contract.decisions.clauses.updates]]
id = "PRODUCT-DISTRIBUTION-001"
version = 2
topic = "product-foundations"
scope = [
    "Distribution and use",
]
statement = "Keep installation, distribution and use simple through one plugin installed by each host's plugin manager, carrying the standard Skill, and repository-owned instructions and commands. Position for reliable development with large agent teams using concrete cases and accurately bounded evidence."
rationale = "The host plugin manager is the installation path users already have, and it carries the guard that a copied Skill folder cannot."

[[change.contract.decisions.clauses]]
id = "signetum-ships-as-a-plugin/add-runtime-guard-enablement"
change_id = "signetum-ships-as-a-plugin"
action = "add"
expected = [
    { id = "INSTALL-RUNTIME-001", version = 0 },
    { id = "GUARD-RULES-001", version = 0 },
    { id = "GUARD-SCOPE-001", version = 0 },
    { id = "CONSUMER-ENABLE-001", version = 0 },
]
reason = "Record where the engine environment lives, what the guard refuses, where it applies and how adoption enables it before implementation."
authority = "changes/signetum-ships-as-a-plugin/change.toml#decisions/signetum-ships-as-a-plugin/plugin-distribution"

[[change.contract.decisions.clauses.updates]]
id = "INSTALL-RUNTIME-001"
version = 1
topic = "skill-installation"
scope = [
    "Engine environment",
]
statement = "The locked engine environment lives in ${XDG_DATA_HOME:-~/.local/share}/signetum/runtime/<fingerprint>, where the fingerprint covers the implementation digest, uv.lock and pyproject.toml and not the install path. A shared runtime/host-python link only starts the launcher, which verifies the environment for its own fingerprint. setup and ordinary commands write nothing into the plugin directory except interpreter bytecode caches."
rationale = "Codex trusts a plugin hook by hashing the plugin directory and excludes only bytecode, virtual environments and egg-info; a receipt written into the Skill marked the hook modified and the host-python symlink made the plugin unhashable. A path-independent fingerprint also lets the Claude copy, the Codex copy and an update candidate share one prepared environment across host version directories."

[[change.contract.decisions.clauses.updates]]
id = "GUARD-RULES-001"
version = 1
topic = "command-guard"
scope = [
    "Plugin PreToolUse guard",
]
statement = "The guard reads tool_input.command from Claude Code and Codex Bash payloads and the payload cwd, splits the command into simple commands through quotes, operators, newlines, heredocs, command substitution, sh -c, eval and common wrappers, and skips Git global options. It exits 2 with one JSON line naming the category and the Signetum operation to use for stash other than list or show, reset --hard, restore other than --staged alone, clean other than a dry run, checkout -- or ., forced checkout, forced or discarding switch, forced push or +refspec, recursive forced rm of ., *, ~, / or $HOME, any git merge or rebase, wt step rebase or push, wt merge, git worktree add, move or remove, wt remove, wt switch -c or --create, git branch -D or --delete --force, and pre-commit run while git diff reports unstaged changes. Other commands, including read-only Git, git commit and git branch -d, exit 0."
rationale = "These are the operations that lost work or bypassed workspace-sync, batch admission, cleanup and workspace-open in Perdura and Signetum. Token-level parsing fixes the regex guard's misses on git -C and --force-with-lease and its false positives on quoted mentions. git commit stays allowed because the protocol commits through it."

[[change.contract.decisions.clauses.updates]]
id = "GUARD-SCOPE-001"
version = 1
topic = "command-guard"
scope = [
    "Plugin PreToolUse guard",
]
statement = "The guard has no internal repository switch: wherever the plugin is enabled the whole rule set applies. A missing interpreter, malformed payload, exception or timeout exits 0 with a diagnostic, and the sh entry maps every status other than 2 to 0."
rationale = "Enable scope is already a host-owned choice, so a second switch would only duplicate it. Failing open matches both hosts, which block only on exit 2, and keeps a broken guard from stopping every shell command; the owner accepted that trade."

[[change.contract.decisions.clauses.updates]]
id = "CONSUMER-ENABLE-001"
version = 1
topic = "consumer-adoption"
scope = [
    "Adoption preview and apply",
]
statement = "The adoption preview that writes signetum.toml also enables the plugin at project scope: enabledPlugins signetum@signetum and the signetum GitHub marketplace in .claude/settings.json, and [plugins.\"signetum@signetum\"] enabled = true in .codex/config.toml. Other settings are preserved, enabled files stay unchanged and an explicit disable is refused for review. Codex reads that layer only for trusted projects and only for a plugin installed in the user's Codex home."
rationale = "Project settings are committed with the repository, so every collaborator's host enables the guard there, and the guard's scope follows the repositories that adopted the protocol. Codex merges trusted project config layers into the plugin set, verified with codex-cli 0.166.0 in a temporary home."

[change.contract.autonomy]
allowed = [
    "Move skills/signetum to plugins/signetum/skills/signetum and update every repository path, tool, test and document that names it.",
    "Rewrite launch.py, installation.py, update.py and the sh launcher for the relocated runtime and host-managed updates, and remove the replaced install modes and their tests.",
    "Add the guard, plugin manifest and hooks file, extend adoption with project-scope enablement and extend the release tool with the plugin version check and pin writer.",
    "Replace update and distribution tests with functional ones and add guard payload tests.",
    "Probe with session-only claude --plugin-dir runs and temporary CODEX_HOME directories, and run ready for this workspace.",
]
requires_confirmation = [
    "Batch admission, final, delivery, release, tagging or committing a marketplace pin.",
    "Editing PyReduce, ~/.claude, ~/.codex or any installed Skill.",
]

[[change.execution.steps]]
id = "STEP-001"
requirements = ["RUNTIME-001"]
action = "Move the engine environment and host-python link to data_root()/runtime and stop excluding .runtime from Skill identity; prove path-independent sharing and an unchanged Skill file set."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["GUARD-001"]
action = "Add command_guard.py and command-guard with payload-driven tests for every rule, the false-positive cases, the dirty-tree check and fail-open behavior."

[[change.execution.steps]]
id = "STEP-003"
requirements = ["PLUGIN-001", "ENABLE-001", "RELEASE-001"]
action = "Move the Skill into plugins/signetum with plugin.json and hooks.json, follow the move through tools, tests and paths, add project-scope enablement to adoption and the plugin version check and pin writer to release tooling, then probe both hosts."

[[change.execution.steps]]
id = "STEP-004"
requirements = ["UPDATE-001"]
action = "Rewrite update around the marketplace pin and the host plugin managers, removing version storage, entry switching, --to and --source, with a fake-host functional test."

[[change.execution.steps]]
id = "STEP-005"
requirements = ["DOC-001"]
action = "Reconcile SKILL.md, the adoption reference, architecture, README, QUICKSTART, CONTRIBUTING, site, release guide and changelog."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-04
source = "The owner, through the coordinating agent, approved the Signetum plugin migration plan (steps S1-S4) with seven decisions: the guard follows the plugin's enable scope and adoption enables it at project scope; update runs the host plugin managers after the compatibility check; the standalone Skill install, update --to and update --source are removed; a guard that cannot run allows; the listed guard rules; the runtime moves to ~/.local/share/signetum/runtime/<fingerprint>; one plugin tree serves both hosts as signetum:signetum. The owner asked for ready without batch, release, tag or marketplace pin change."
