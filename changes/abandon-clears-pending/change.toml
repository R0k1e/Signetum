[change]
schema_version = 2
id = "abandon-clears-pending"

[change.source]
kind = "human_direction"
summary = "A downstream batch was abandoned after a failed admission left an open merge and a pending operation record. The record survived the abandonment and blocked reopening a batch of the same name, and abandonment refused while the merge was open. The owner approved fixing this and publishing a patch release."

[change.contract]
version = 1
approved_base = "2a439622b9a8308a070b7f81e83b09c67cd2725c" # pragma: allowlist secret

[[change.contract.requirements]]
id = "ABANDON-001"
outcome = "Abandoning or removing a workspace, or abandoning a branch, retires every pending operation record of that branch and keeps their summaries in its retirement record, so no blocking record outlives the work."
acceptance = [
    "After workspace-abandon and branch-abandon no pending record of the branch remains and the retirement record lists the retired operations.",
]

[[change.contract.requirements]]
id = "STALE-002"
outcome = "A pending operation record whose branch or checkout is gone, or whose checkout has no open merge and no matching commit, never blocks a new operation: the new request replaces it."
acceptance = [
    "A new operation with a different intent proceeds over the pending record of a vanished branch.",
]

[[change.contract.requirements]]
id = "MERGE-003"
outcome = "workspace-abandon with --discard aborts an open merge itself, since the owner has already confirmed the exact tip, instead of refusing; without --discard it still refuses and names the flag."
acceptance = [
    "An abandoned workspace with an open merge and a pending record is removed with --discard, and is refused without it.",
]

[[change.contract.requirements]]
id = "REL-004"
outcome = "Release 0.9.5 carries the fix with the package and Skill versions and the changelog updated."
acceptance = ["Package and Skill versions agree on 0.9.5 and the changelog has a 0.9.5 section."]

[change.contract.autonomy]
allowed = [
    "Extend the operation records and workspace owners and their tests within these outcomes.",
    "Prepare, deliver and publish release 0.9.5 after final passes.",
]
requires_confirmation = [
    "Changing a record or manifest schema, loosening the command guard, or running update or install against an installed Skill.",
]

[[change.contract.decisions]]
id = "abandon-clears-pending/owner"
change_id = "abandon-clears-pending"
authority = "changes/abandon-clears-pending/change.toml#decisions/abandon-clears-pending/owner"
parents = [
    "message-check-before-intent/message-first",
    "approval-before-commit/commit-time-approval",
]
reason = "Pending intent exists to survive an interrupted Git effect, so it must end with the work it belongs to and never outlive its branch. Aborting the open merge inside workspace-abandon --discard keeps the guard a simple refuser of manual merge handling and reuses the owner's exact tip confirmation that abandonment already requires; loosening the guard for git merge --abort would add a second, weaker route around the same confirmation. Reopen if abandonment must preserve a half-resolved merge."

[[change.contract.decisions.clauses]]
id = "abandon-clears-pending/clauses"
change_id = "abandon-clears-pending"
action = "amend"
expected = [
    { id = "WORKSPACE-ABANDON-001", version = 3 },
    { id = "COMMIT-MERGE-001", version = 4 },
]
authority = "changes/abandon-clears-pending/change.toml#decisions/abandon-clears-pending/owner"
reason = "Abandonment retires pending intent and aborts its merge; stale intent never blocks."

[[change.contract.decisions.clauses.updates]]
id = "WORKSPACE-ABANDON-001"
version = 4
topic = "workspace-retirement"
scope = ["Workspace abandonment"]
statement = "maintenance workspace-abandon removes a checkout, registered as a workspace or not, that proves neither delivered nor contained, and maintenance branch-abandon removes a local branch without a checkout that the delivery branch does not contain, only when given the exact current tip the owner confirmed, the owner's identity, the confirmation source and a reason; the retirement record keeps them with the tip and the summaries of the pending operation records the removal retired. An Agent may run either itself, citing in --source where the owner confirmed that tip; it never infers a confirmation. workspace-abandon takes the repository from the named checkout. maintenance leftovers lists such checkouts and branches read-only. Removal refuses the delivery branch and checkout, other open Git operations and staged changes, and discards other uncommitted work only with --discard. With --discard, workspace-abandon aborts an open merge itself after checking the confirmed tip. These are the only removals for undelivered work; batch-discard is removed."
rationale = "No blocking record outlives its work, and the confirmed tip already authorizes discarding the merge."

[[change.contract.decisions.clauses.updates]]
id = "COMMIT-MERGE-001"
version = 5
topic = "skill-first-development"
scope = ["Commit checks", "Workspace synchronization", "Batch admission", "Publication"]
statement = "The project's commit-msg hook judges a request's message before any operation record, workspace or branch is created. A recorded operation persists its pending intent before Git effects. A pending operation that produced no commit takes a corrected message on retry, and a clean open merge the hook refused is committed with it. Pending intent whose branch or checkout is gone, or whose checkout has no open merge and no matching commit, never blocks a new operation. The commit check validates the actual candidate commit, parents and tree against that operation, and completion and retry retain the same identity. New operation messages contain caller-supplied real content without automatically added Signetum trailers or internal tags. Ordinary commits and unrelated merges retain their authorization and project validation rules."
rationale = "Intent that cannot take effect must not deadlock a retry."

[[change.execution.steps]]
id = "STEP-001"
requirements = ["ABANDON-001", "STALE-002", "MERGE-003"]
action = "Retire pending records on removal and abandonment, treat stale pending intent as replaceable, abort an open merge on discard, with regression tests."

[[change.execution.steps]]
id = "STEP-002"
requirements = ["REL-004"]
action = "Set versions to 0.9.5 and add the changelog section."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-19
statement = "The owner approved making abandonment retire pending operation records and abort an open merge, letting stale pending intent never block a new operation, and publishing the fix as patch release 0.9.5."
