[change]
schema_version = 1
id = "skill-first-and-lean-development"

[change.source]
kind = "human_direction"
summary = "Implement the approved single Signetum Skill entry, internal scaffold, lean test preparation and compressed future decision records."

[change.contract]
version = 2
approved_base = "b9fcd680fa3cb5613665a89704d56a8dce28652d"

[[change.contract.requirements]]
id = "SKILL-001"
outcome = "Distribute the standard Skill under the Signetum identity."
acceptance = [
    "Rename the maintained folder, frontmatter, launcher, UI metadata and packaged resources to signetum; update maintained callers and representative installed verification, preserving immutable historical identities and consumer runtime paths.",
]

[[change.contract.requirements]]
id = "SKILL-002"
outcome = "Use one public Skill entry for new and existing projects."
acceptance = [
    "Remove the public Template product route and parallel publication/version story; retain internal scaffold and runtime evidence. Both new and existing repositories use the same reviewed adoption and local runtime, with a pinned tool acquisition path and an installed cold-start traversal through a real approved change and readiness.",
]

[[change.contract.requirements]]
id = "SKILL-003"
outcome = "Compress future development decisions at their authoring source."
acceptance = [
    "Default to one change record and significant append journal with derived current decisions; routine choices create no decision document, important decisions preserve their basis once, clause amendments are targeted, and standalone ADRs are conditional cross-change authorities rather than mandatory duplicates. Update authoring guidance, scaffold and closure while preserving accepted history.",
]

[[change.contract.requirements]]
id = "SKILL-004"
outcome = "Move pure test matrices out of repository preparation."
acceptance = [
    "Extract the existing partition owner pure snapshot planning, keep its configuration matrix without Git and retain necessary source bindings. Move component refusal cases out of Git fixtures and use minimal release materials. Retain core, generated and installed distinct risks, remove obsolete public-template pins, and compare preparation and duration without new permanent budgets.",
]

[[change.contract.requirements]]
id = "SKILL-005"
outcome = "Prepare a single main source and release authority."
acceptance = [
    "Configure source delivery and release qualification for main through repository authority, update workflows and maintained links, and prepare reviewable source migration without force pushes or rewriting historical tags. Actual delivery remains subject to the existing explicit delivery review.",
]

[[change.contract.requirements]]
id = "SKILL-006"
outcome = "Reconcile current guidance and verify the complete product path."
acceptance = [
    "Consolidate user onboarding, Agent adoption procedure and configuration references; regenerate portable code, validate standard and installed Skill behavior, run full member checks, resolve retained discoveries and report exact source and pending delivery state.",
]

