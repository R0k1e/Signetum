[[change.contract.decisions.clauses.updates]]
id = "SKILL-ENTRY-001"
version = 1
topic = "skill-first-development"
scope = [
    "Signetum product and development",
]
statement = "Signetum is distributed through the standard signetum Skill; new and existing projects share one explicit local adoption path. Internal scaffold materials are not a second public product."
rationale = "See the cross-change product decision and the exact approved outcomes."

[[change.contract.decisions.clauses.updates]]
id = "SKILL-DECISION-001"
version = 1
topic = "skill-first-development"
scope = [
    "Signetum product and development",
]
statement = "Keep consequential reasoning once in its accepted change or independently necessary cross-change decision, preserve significant append history, and derive current clauses; routine implementation and command narration create no duplicate document."
rationale = "See the cross-change product decision and the exact approved outcomes."

[[change.contract.decisions.clauses.updates]]
id = "SKILL-TEST-001"
version = 1
topic = "skill-first-development"
scope = [
    "Signetum product and development",
]
statement = "Pure configuration and component matrices run without Git or installed environments; repository, portable and installed traversals protect only their own binding and execution risks."
rationale = "See the cross-change product decision and the exact approved outcomes."

[[change.contract.decisions.clauses]]
id = "skill-first-and-lean-development/source-clause"
change_id = "skill-first-and-lean-development"
action = "amend"
expected = [
    { id = "DIST-SOURCE-001", version = 1 },
]
authority = "docs/decisions/ADP-skill-first-development.md"
reason = "Replace the former engine/main product split without weakening source or publication checks."

[[change.contract.decisions.clauses.updates]]
id = "DIST-SOURCE-001"
version = 2
topic = "distribution-authorities"
scope = [
    "Product source and Skill publication",
]
statement = "One delivered main source owns the package, standard Signetum Skill and internal scaffolding; release preflight derives the delivered branch from repository policy and verifies exact source, versions and tag. Skill installation and preflight grant no publication authority."
rationale = "A single product entry should have a single source and release contract."

[[change.contract.decisions]]
id = "skill-first-and-lean-development/batch-source-preparation"
change_id = "skill-first-and-lean-development"
authority = "changes/skill-first-and-lean-development/change.toml#decisions/skill-first-and-lean-development/batch-source-preparation"
parents = [
    "skill-first-and-lean-development/boundaries",
]
reason = "The actual main migration refused before admission because the old tree lacks prepare. Base preparation duplicates the merged-source owner; create the immutable batch, admit already-qualified named members, then require preparation and batch checks on actual combined source. Member opening retains its preparation requirement."

[[change.contract.decisions.clauses]]
id = "skill-first-and-lean-development/batch-preparation-clause"
change_id = "skill-first-and-lean-development"
action = "add"
expected = [
    { id = "SKILL-BATCH-001", version = 0 },
]
reason = "Necessary source migration repair without a bypass or additional lifecycle operation."
authority = "changes/skill-first-and-lean-development/change.toml#decisions/skill-first-and-lean-development/batch-source-preparation"

[[change.contract.decisions.clauses.updates]]
id = "SKILL-BATCH-001"
version = 1
topic = "skill-first-development"
scope = [
    "Batch assembly",
]
statement = "Batch creation records the immutable delivery base without executing its obsolete environment. Named qualified members must declare prepare and batch gates; after admission, the existing owner prepares and checks the actual combined tree. Member opening still prepares its approved source."
rationale = "A base cannot be required to have capabilities introduced by the member being admitted, and duplicate preparation wastes work."

[change.contract.autonomy]
allowed = [
    "Implement the confirmed Skill rename, product routing, test and document refactors, verify installed cold-start behavior, and prepare exact source migration and delivery review.",
]
requires_confirmation = [
    "Mutate the delivery worktree or remote source branch through actual delivery, publish tags or packages, or modify Perdura.",
]

[[change.contract.excluded]]
statement = "New template repository, automatic consumer updates, new persistent bootstrap service, RAM volumes and background deletion."
reason = "The approved plan removes public entry and maintenance layers rather than adding them."

