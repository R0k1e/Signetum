[[change.execution.steps]]
id = "STEP-1"
requirements = [
    "SKILL-001",
    "SKILL-002",
]
action = "Rename maintained Skill identities and package paths; extend the installed adoption traversal instead of adding a parallel lifecycle matrix; preserve host and application boundaries."

[[change.execution.steps]]
id = "STEP-2"
requirements = [
    "SKILL-003",
    "SKILL-006",
]
action = "Keep decision rationale in the cross-change authority or owning change once; consolidate Skill, user and binding instructions and update current architecture without rewriting accepted history."

[[change.execution.steps]]
id = "STEP-3"
requirements = [
    "SKILL-004",
]
action = "Retain pure matrices, extend the existing planning owner with pure snapshot inputs, replace expensive per-case Git setup, reuse source-binding integration and installed evidence, delete only public-template prose pins."

[[change.execution.steps]]
id = "STEP-4"
requirements = [
    "SKILL-005",
    "SKILL-006",
]
action = "Bind release to repository delivery policy, prepare main source migration and review, regenerate and build, compare targeted costs, reconcile and run complete member validation. Remove duplicate batch-base preparation while retaining member gate checks and mandatory post-admission preparation; retire exact old Skill evidence through the existing approved writer."

