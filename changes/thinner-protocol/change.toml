reason = "The approved 0.8 plan removes measured process friction while preserving six delivery invariants."

[[change.contract.decisions.clauses.updates]]
id = "COMMIT-CHECK-001"
rationale = "The approved 0.8 plan removes measured process friction while preserving six delivery invariants."
requires = []
