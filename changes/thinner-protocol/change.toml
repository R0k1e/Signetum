    "Member readiness",
    "Batch admission and continuation",
    "Final validation",
]
statement = "An owner authorization committed before the first implementation commit is required by the shared hook, ready and final predicate. Approval is recorded once with actor, date and a neutral statement. Later scope revisions are recorded, never re-approved; final review derives revisions from change.toml history. Exact content evidence remains mandatory."
status = "active"
