[change]
schema_version = 1
id = "streamline-development-operations"

[change.source]
kind = "human_direction"
summary = "Complete stages one to four of the approved next-step plan: operations, test efficiency, concise decision records and optional validation optimization."

[change.contract]
version = 1
approved_base = "833b49cf8307ef589651bae9a3e9270911864ffb"

[[change.contract.requirements]]
id = "FLOW-001"
outcome = "Provide a read-only workflow status and make changed selection-only."
acceptance = [
    "Status derives workspace, changes, outstanding findings, exact receipt validity and next action without running checks or storing another status; replace status-all and all maintained callers; changed no longer executes checks or accepts redundant validate-only input.",
]

[[change.contract.requirements]]
id = "FLOW-002"
outcome = "Use consistent structured failures across daily protocol and adoption utilities."
acceptance = [
    "Malformed arguments and operational refusals produce one versioned JSON result with cause and next action, preserving existing exit categories and applied-transaction details; do not introduce another execution or journal owner.",
]

[[change.contract.requirements]]
id = "FLOW-003"
outcome = "Make testing and decision records low-cost by structure and Skill instructions."
acceptance = [
    "Keep one record/journal and derived decisions; teach distinct-risk test placement, minimal sufficient rationale, relevant alternatives, reopening conditions, references instead of repeated prose, and stop redundant validation; no new document type, prose pins or fixed budgets.",
]

[[change.contract.requirements]]
id = "FLOW-004"
outcome = "Emit useful successful and failed execution cost diagnostics."
acceptance = [
    "Retain pytest preparation, collection, phase, execution and cleanup observations with actual workers; timing never changes a verdict, first failure or allocator; successful reports must actually emit their measurements.",
]

[[change.contract.requirements]]
id = "FLOW-005"
outcome = "Provide an optional committed-tree Python dependence provider."
acceptance = [
    "Reuse the existing structured selection boundary; select dependent unit tests, preserve modified tests and declared family rules; unknown paths, dynamic imports, deleted modules and syntax uncertainty conservatively fall back; never import the judged tree and final remains complete.",
]

[[change.contract.requirements]]
id = "FLOW-006"
outcome = "Provide optional duration-weighted scheduling without changing test membership."
acceptance = [
    "A common deterministic ordering/grouping core and pytest adapter preserve scheduling units and all collected tests; missing weights fall back safely and weights are hints, not pass criteria; reuse existing runner and source-bind declared configuration.",
]

[[change.contract.requirements]]
id = "FLOW-007"
outcome = "Provide source-bound CI partition planning, execution and complete aggregation."
acceptance = [
    "Plan files before test import, keep declared shared groups together, execute through the current supervised adapter, and refuse missing, duplicate, overlapping, failed, cancelled or mismatched partition results. Bind source, tools, commands and partition configuration. Aggregation is CI evidence and never grants lifecycle readiness or delivery permission.",
]

[[change.contract.requirements]]
id = "FLOW-008"
outcome = "Verify public, generated and installed paths and stop at clean readiness."
acceptance = [
    "Reuse affected integration assets and core matrices; installed optional utilities work outside the source checkout; reconcile discoveries. Do not modify Perdura, integrate or publish. RAM volumes and background deletion are excluded.",
]

[[change.contract.decisions]]
id = "streamline-development-operations/boundaries"
change_id = "streamline-development-operations"
authority = "docs/decisions/ADP-development-feedback-is-bounded-and-derived.md"
reason = "The owner approved implementing the first four stages and explicitly excluded RAM volumes and background deletion."

[[change.contract.decisions.topics]]
expected_version = 0

