reason = "Keep one source and execution authority while reducing user friction."
authority = "docs/decisions/ADP-development-feedback-is-bounded-and-derived.md"

[[change.contract.decisions.clauses.updates]]
id = "FLOW-STATUS-001"
version = 1
topic = "development-feedback"
scope = [
    "Local commands, validation and agent instructions",
]
statement = "Status and change planning are read-only derived views; checks execute only through test, readiness or final owners."
rationale = "Repeated diagnostic and readiness suites waste work; copied state becomes stale."

[[change.contract.decisions.clauses.updates]]
id = "FLOW-RECORD-001"
version = 1
topic = "development-feedback"
scope = [
    "Local commands, validation and agent instructions",
]
statement = "Keep the minimum record needed to reconstruct consequential choices, including material alternatives and reopening conditions, with original references instead of repeated summaries."
rationale = "A conclusion alone loses reasoning, while transcripts burden review."

[[change.contract.decisions.clauses.updates]]
id = "FLOW-OPTIONAL-001"
version = 1
topic = "development-feedback"
scope = [
    "Local commands, validation and agent instructions",
]
statement = "Dependence selection, weighted scheduling and verified partitioning are optional capabilities with repository-owned inputs; neither heuristics nor timing can replace complete final validation."
rationale = "These techniques generalize, but their language and grouping facts are not generic defaults."

[change.contract.autonomy]
allowed = [
    "Implement and remove superseded in-repository entrypoints, update policy and Skill, generate portable artifacts, validate installed behavior, reconcile and stop at ready.",
]
requires_confirmation = [
    "Modify Perdura or delivery worktrees, integrate, publish, add RAM volumes or background deletion.",
]

[[change.contract.excluded]]
statement = "Perdura-side adoption, actual delivery/publication, RAM volumes, background deletion, cross-machine persistent services and automatic history interpretation."
reason = "The owner authorized only the first four stages in this repository and explicitly excluded these storage optimizations."

