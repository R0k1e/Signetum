[change]
schema_version = 1
id = "retired-tests-released-once"

[change.source]
kind = "human_direction"
summary = "Implement only proposal C of the owner-approved structural plan: retired tests are released by the collecting run, without re-judging later history."

[change.contract]
version = 1
approved_base = "e8bd4d4b7d723c9137d3c194435c34200e1f7245"

[[change.contract.requirements]]
id = "RETIRE-001"
outcome = "An optional not_collected node report field releases an unreported owed node only in a passing shard when its file changed between the remembered failure tip and this gate tip. Receipt details retain the node, last retiring commit and basis not_collected. Packaged pytest reports only owed nodes absent from collection whose file was collected or no longer exists."
acceptance = [
    "A failed parametrized case removed while retaining its function is released on the next passing gate with the retiring commit.",
    "An unchanged file, narrowed collection excluding the file, or failing shard cannot release a node.",
]

[[change.contract.requirements]]
id = "COMPAT-002"
outcome = "Runners omitting not_collected retain the name-absence heuristic and journal observation release; failure receipt schema remains v1. Current architecture and runner instructions describe both paths."
acceptance = [
    "Existing runners and failure-memory tests remain functional; name heuristic releases carry basis name_absent.",
    "Functional packaged runner tests cover serial and xdist collection, deselection and removed files.",
]

[change.contract.autonomy]
allowed = [
    "Implement proposal C in failure memory, execution, runner and adapters; extend functional tests and reconcile affected documentation; run ready.",
]
requires_confirmation = [
    "Implement other structural members, change selection or first-failure rules, modify PyReduce, batch, deliver, push, tag or release.",
]

[[change.contract.decisions]]
id = "retired-tests-released-once/collection-release"
change_id = "retired-tests-released-once"
authority = "changes/retired-tests-released-once/change.toml#decisions/retired-tests-released-once/collection-release"
reason = "The owner approved proposal C. Derive retirement at the first collecting gate rather than re-judging function names at a later tip; retain optional runner compatibility. A side ledger or required journal ceremony adds redundant authority. Reopen if a runner cannot distinguish excluded files from collected files."
parents = [
    "owed-nodes-run-first/runner-feedback",
    "failure-record-names-every-failed-check/every-failed-check",
]

[[change.contract.decisions.clauses]]
id = "retired-tests-released-once/collected-retirement"
change_id = "retired-tests-released-once"
action = "amend"
expected = [
    { id = "EFFICIENCY-FAIL-001", version = 5 },
]
authority = "changes/retired-tests-released-once/change.toml#decisions/retired-tests-released-once/collection-release"
reason = "Collection identifies retired parametrized cases that a function-name heuristic cannot distinguish; changed-file history binds the release to this failure and run."

[[change.contract.decisions.clauses.updates]]
id = "EFFICIENCY-FAIL-001"
version = 6
topic = "validation-efficiency"
scope = [
    "Validation execution, diagnostics and CI",
    "Change journals",
]
statement = "A failed gate leaves a machine-local failure receipt for its workspace naming first-attempt failed, retry-recovered and runner-reported unreached nodes, and every shard of the run that did not pass with its exit code, its runner-reported failed checks and, for a skipped shard, the prerequisites it was skipped after; the failed operation result lists the same shards. Failed shards and checks are reported, not owed. Unreached nodes fail their shard. The next gate in that workspace accepts a remembered node that an observation in a change journal the workspace changed names as evidence with its root cause, whatever its shard selection. Otherwise its shard must be selected again, or the gate refuses before running checks, and the node must report passing in that run, unless that shard passes without reporting it, the workspace changed its test file since its base and that file no longer holds its test; such a vanished node is released and its shard's receipt details name it. A retry success never offsets a first failure. A passing shard may also release an unreported owed node reported not_collected when its file changed since the failure tip; receipt details bind the last retiring commit and basis. Runners omitting not_collected retain the name-absence heuristic and journal release."
rationale = "Collection identifies retired parametrized cases that a function-name heuristic cannot distinguish; changed-file history binds the release to this failure and run."

[[change.execution.steps]]
id = "STEP-IMPLEMENT"
requirements = [
    "RETIRE-001",
    "COMPAT-002",
]
action = "Extend failure-memory and packaged runner functional traversals, implement optional collection release with immutable commit attribution, reconcile current docs and run ready. Retain existing failure and compatibility evidence; add no coverage relaxation."

[change.approval]
actor = "Repository owner"
recorded_at = 2026-11-09
source = "Repository owner approved the structural plan and all eight open questions as recommended (2026-11-09), relayed through the task. This member implements only proposal C."
contract_digest = "sha256:b1c999c84edad26a7c2465be51a64a8f941f15c66b30beda69ce2fb3f4d5c547"
