name: RepoSeal

on:
  pull_request:
  push:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx --from reposeal==3.0.0 reposeal check manifest --manifest reposeal.yaml
      - run: uvx --from reposeal==3.0.0 reposeal check traceability --repository .
