name: Feature request
description: Propose a new observable Signetum outcome.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or Agent workflow failure, not a preferred implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Observable outcome
      description: State what a caller or reviewer should be able to observe.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and risks
      description: Note scope, compatibility, security, performance, or human-decision concerns.
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Describe the behavior evidence that would prove the outcome.
