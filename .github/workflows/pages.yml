name: Pages

on:
  push:
    branches: [engine]
    paths:
      - "site/**"
      - "assets/brand/**"
      - "src/reposeal/site.py"
      - "src/reposeal/cli.py"
      - ".github/workflows/pages.yml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: astral-sh/setup-uv@e27c02bca3ef8ee6d166d8a11c434f8b6247f526 # v7.2.1
        with:
          version: "0.9.28"
      - run: uv sync --locked
      - run: uv run --no-sync reposeal site build --repository . --destination .pages-artifact
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .pages-artifact
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
