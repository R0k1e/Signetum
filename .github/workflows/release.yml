name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.ref_name }}
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        if: vars.PUBLISH_PYPI == 'true'
        with:
          version: "2026.8.2"
          install_args: uv
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.sha }}
          path: dist
      - run: sha256sum --check dist/SHA256SUMS
      - name: Publish to the optional package index
        if: vars.PUBLISH_PYPI == 'true'
        run: uv publish --trusted-publishing always dist/*.whl dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
