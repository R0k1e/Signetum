repository:
  schema_version: 1
  product: signetum
  architecture: docs/ARCHITECTURE.md
  environment:
    authority: uv
    manifest: pyproject.toml
    lock: uv.lock
  policy:
    mandatory:
      - group: signetum
        reference: .agents/repo-dev/references/signetum.md
    selectors:
      - group: python-uv
        intents: [implementation, validation, bootstrap]
        paths: [pyproject.toml, uv.lock, src, tests]
        reference: .agents/repo-dev/references/python-uv.md
      - group: git-worktrunk
        intents: [planning, implementation, delivery, recovery]
        paths: [changes, plans]
        reference: .agents/repo-dev/references/git-worktrunk.md
  authorities:
    reviews: changes/*/review.toml
    specifications: changes/*/specs/*.toml
    plans: changes/*/plans/*.md
    decisions: docs/decisions/*.md
    manifest_schema: signetum.resources.schemas
    profiles: signetum.resources.profiles
  validation:
    targeted: uv run pytest tests/unit tests/integration/test_cli_manifest.py
    complete: uv run pre-commit run --all-files
  lifecycle:
    public_operations:
      - workspace-open
      - changed
      - ready
      - batch-open
      - batch-admit
      - batch-continue
      - final
      - batch-deliver
