schema_version: 1
product: replace-with-product-name
architecture: docs/ARCHITECTURE.md
authorities:
  changes: changes
  records: changes/*/change.toml
  journals: changes/*/events.jsonl
  decisions: docs/decisions
policy:
  mandatory:
    - group: lifecycle
      reference: .agents/signetum/references/lifecycle.md
    - group: safety
      reference: .agents/signetum/references/safety.md
  routes:
    - group: application
      intents: [implementation, bugfix, refactor, test]
      paths: ["**"]
      reference: .agents/signetum/references/application.md
validation:
  changed: just changed
  ready: just ready
  final: just final
delivery:
  branch: main
