repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        exclude: '^(\.env\.example|\.vscode/settings\.json)$'
      - id: check-yaml
      - id: check-json
        exclude: '^\.vscode/settings\.json$'
      - id: check-toml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.6
    hooks:
      - id: ruff
      - id: ruff-format
        args: [--check]
  - repo: local
    hooks:
      - id: product-surface
        name: product-surface
        entry: uv run signetum check product-surface --repository .
        language: system
        pass_filenames: false
        always_run: true
      - id: ty
        name: ty
        entry: uv run ty check
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: typos
        name: typos
        entry: uv run typos
        language: system
        pass_filenames: false
