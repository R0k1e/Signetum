[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reposeal"
version = "3.0.0"
description = "RepoSeal: seal every change with evidence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.20,<1",
]

[project.scripts]
reposeal = "reposeal.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.9",
    "hypothesis>=6.0",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "ty>=0.0.1a25",
    "typos>=1.42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reposeal"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "reposeal/resources/schemas/contracts"
"skills/repo-dev" = "reposeal/resources/skills/repo-dev"

[tool.hatch.build.targets.sdist]
include = [
    "/.agents",
    "/.github",
    "/AGENTS.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/QUICKSTART.md",
    "/README.md",
    "/SECURITY.md",
    "/changes",
    "/docs",
    "/examples",
    "/profiles",
    "/schemas",
    "/skills",
    "/src",
    "/tests",
    "/template",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "ANN401", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"tests/integration/test_clone_ready_template.py" = ["S101", "S603"]
"tests/test_batch_admission.py" = ["S101", "S603"]
# Security-boundary rationale: this lifecycle authority invokes the fixed Git
# executable with tuple arguments after validating repository identities.
"src/reposeal/lifecycle.py" = ["S603"]
"template/.agents/repo-dev/runtime/lifecycle.py" = ["S603"]
# Security-boundary rationale: both adapters resolve Git to an absolute host
# executable and pass validated tuple arguments without a shell.
"src/reposeal/release/__init__.py" = ["S603"]
"src/reposeal/traceability/boundary.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=reposeal", "--cov-report=term-missing", "--cov-fail-under=90"]

[tool.coverage.run]
branch = true
source = ["reposeal"]
# Lifecycle orchestration is exercised through behavioral Git-boundary tests;
# excluding the moved authority preserves the v2 coverage boundary.
omit = ["src/reposeal/lifecycle.py"]

[tool.ty.environment]
python-version = "3.12"
