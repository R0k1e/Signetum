[dependency-groups]
dev = [
    "bandit>=1.9",
    "hypothesis>=6.0",
    "jsonschema>=4.23",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8,<4",
    "ruff>=0.14",
    "ty>=0.0.1a25",
    "typos>=1.42",
    "signetum",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "S",
    "RUF",
    "ANN401",
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
]
"tests/unit/validation/test_process_observation.py" = [
    "S101",
    "S603",
]
"tests/integration/test_delivery_recovery.py" = [
    "S101",
    "S603",
]
"tests/unit/validation/test_repository.py" = [
    "S101",
    "S603",
]
"tests/test_batch_admission.py" = [
    "S101",
    "S603",
]
"tests/conftest.py" = [
    "S603",
]
"tests/unit/validation/test_shard_bounds_and_locks.py" = [
    "S101",
    "S603",
    "S607",
]
"skills/signetum/scripts/engine/signetum/lifecycle.py" = [
    "S603",
]
"skills/signetum/scripts/engine/signetum/worktrunk.py" = [
    "S603",
]
"skills/signetum/scripts/engine/signetum/release/__init__.py" = [
    "S603",
]
"skills/signetum/scripts/engine/signetum/traceability/boundary.py" = [
    "S603",
]
"skills/signetum/scripts/engine/signetum/validation/repository.py" = [
    "S603",
]

[tool.pytest.ini_options]
pythonpath = ["."]
norecursedirs = [
    "fixtures",
]
testpaths = [
    "tests",
]
markers = [
    "world: observes mutable external state and belongs only to final validation",
]
addopts = [
    "--cov=signetum",
    "--cov=tools",
    "--cov-report=term-missing",
    "--cov-fail-under=0",
]

[tool.coverage.run]
relative_files = true
branch = true
source = [
    "signetum",
    "tools",
]
patch = [
    "subprocess",
    "execv",
]
omit = [
    "*/signetum/lifecycle.py",
]

[tool.coverage.report]
precision = 2

[tool.ty.environment]
python-version = "3.12"

[tool.uv]
package = false

[tool.uv.sources.signetum]
path = "skills/signetum/scripts/engine"
editable = true

[project]
name = "signetum-development"
version = "0"
requires-python = ">=3.12"

[tool.coverage.paths]
engine = [
    "skills/signetum/scripts/engine/signetum",
    "*/signetum/scripts/engine/signetum",
    "*/site-packages/signetum",
]

skill = [
    "skills/signetum",
    "*/installed Skill*/signetum",
    "signetum",
]
