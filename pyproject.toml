[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "development-foundation"
version = "2.0.0"
description = "Versioned contracts for repository development"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.20,<1",
]

[project.scripts]
foundation = "development_foundation.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.9",
    "hypothesis>=6.0",
    "pip-audit>=2.9",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "ruff>=0.14",
    "ty>=0.0.1a25",
    "typos>=1.42",
]

[tool.hatch.build.targets.wheel]
packages = ["src/development_foundation"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "development_foundation/resources/schemas/contracts"
"skills/repo-dev" = "development_foundation/resources/skills/repo-dev"

[tool.hatch.build.targets.sdist]
include = ["/AGENTS.md", "/README.md", "/docs", "/profiles", "/schemas", "/skills", "/src", "/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF", "ANN401", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Security-boundary rationale: this lifecycle authority invokes the fixed Git
# executable with tuple arguments after validating repository identities.
"tools/development_foundation/merge_plan_delivery.py" = ["S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--cov=development_foundation", "--cov-report=term-missing", "--cov-fail-under=90"]

[tool.coverage.run]
branch = true
source = ["development_foundation"]

[tool.ty.environment]
python-version = "3.12"
